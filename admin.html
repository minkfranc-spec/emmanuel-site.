<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN | Emmanuel DPV</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0f0f0f; color: white; padding: 20px; text-align: center; }
        .admin-box { max-width: 700px; margin: auto; background: #1a1a1a; padding: 30px; border-radius: 25px; border: 2px solid #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        h1 { color: #d4af37; font-size: 1.8em; margin-bottom: 10px; }
        .status-panel { background: #222; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .status-indicator { font-weight: bold; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 15px; transition: 0.5s; color: white; }
        .online { background: #27ae60; box-shadow: 0 0 15px #27ae60; }
        .standby { background: #c0392b; box-shadow: 0 0 15px #c0392b; }
        textarea { width: 100%; height: 120px; border-radius: 10px; border: none; padding: 15px; background: #252525; color: #00ff00; font-family: monospace; margin-top: 10px; box-sizing: border-box; }
        .btn { cursor: pointer; border: none; border-radius: 50px; font-weight: bold; transition: 0.3s; padding: 15px 30px; width: 100%; margin-top: 15px; text-transform: uppercase; }
        .btn-magic { background: #d4af37; color: black; font-size: 1.1em; }
        .btn-load { background: #34495e; color: white; }
        .btn-copy { background: white; color: black; }
        .footer-link { margin-top: 20px; font-size: 0.8em; color: #666; }
        a { color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>🏛️ COMMANDE DU SANCTUAIRE</h1>
    <p>Pointage actuel : <strong>emmanuel-dpv.pages.dev</strong> ⚡</p>

    <div class="status-panel">
        <div id="statusInd" class="status-indicator online">● SITE EN LIGNE</div><br>
        <button class="btn btn-magic" onclick="basculerStandBy()">✨ BASCULER LE BOUTON MAGIQUE</button>
    </div>

    <div style="text-align: left;">
        <label>📥 1. COLLEZ LE DATA.JSON DE GITHUB :</label>
        <textarea id="inputJSON" placeholder="Collez ici..."></textarea>
        <button class="btn btn-load" onclick="chargerDonnees()">📥 CHARGER LA STRUCTURE</button>
    </div>

    <div style="text-align: left; margin-top: 20px;">
        <label>📤 2. RÉSULTAT À COPIER :</label>
        <textarea id="outputJSON" readonly placeholder="Le résultat apparaîtra ici..."></textarea>
        <button class="btn btn-copy" onclick="copier()">⚡ COPIER POUR GITHUB</button>
    </div>

    <div class="footer-link">
        <p>Lien du site : <a href="https://emmanuel-dpv.pages.dev" target="_blank">emmanuel-dpv.pages.dev</a></p>
    </div>
</div>

<script>
    let fluxGlobal = { status: "online", messages: [] };

    // 1. Charger les données pour ne rien perdre
    function chargerDonnees() {
        const raw = document.getElementById('inputJSON').value.trim();
        try {
            const parsed = JSON.parse(raw);
            if (parsed.messages) {
                fluxGlobal.status = parsed.status || "online";
                fluxGlobal.messages = parsed.messages;
            } else {
                fluxGlobal.messages = Array.isArray(parsed) ? parsed : [];
                fluxGlobal.status = "online";
            }
            actualiserInterface();
            alert("✅ Données chargées de la Genèse !");
        } catch (e) {
            alert("❌ Erreur : Format JSON invalide.");
        }
    }

    // 2. LE BOUTON MAGIQUE (Celui qui doit marcher !)
    function basculerStandBy() {
        fluxGlobal.status = (fluxGlobal.status === "online") ? "standby" : "online";
        actualiserInterface();
        const mode = fluxGlobal.status === "online" ? "EN LIGNE 🟢" : "ARRÊTÉ (Stand-by) 🔴";
        alert("Bouton Magique : Passage en " + mode);
    }

    // 3. Mise à jour du voyant ET du texte final
    function actualiserInterface() {
        const ind = document.getElementById('statusInd');
        const out = document.getElementById('outputJSON');
        
        if (fluxGlobal.status === "standby") {
            ind.innerText = "● MODE STAND-BY ACTIVÉ";
            ind.className = "status-indicator standby";
            ind.style.background = "#c0392b"; // Force le rouge
        } else {
            ind.innerText = "● SITE EN LIGNE";
            ind.className = "status-indicator online";
            ind.style.background = "#27ae60"; // Force le vert
        }
        
        out.value = JSON.stringify(fluxGlobal, null, 2);
    }

    function copier() {
        const out = document.getElementById('outputJSON');
        out.select();
        out.setSelectionRange(0, 99999); // Pour mobile
        document.execCommand('copy');
        alert("🎯 Code copié ! Collez-le maintenant sur GitHub dans data.json");
    }
</script>

</body>
</html>
