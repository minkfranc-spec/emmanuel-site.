<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ADMIN REPAIR | Emmanuel DPV</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --error: #ff4d4d; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        h1 { color: var(--gold); text-align: center; text-transform: uppercase; letter-spacing: 3px; }
        
        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { width: 100%; height: 400px; background: #000; color: #00ff00; border: 1px solid #333; padding: 15px; border-radius: 10px; font-family: 'Courier New', monospace; resize: none; }
        
        .diagnostic-box { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 20px; margin-top: 20px; }
        .error-item { border-left: 4px solid var(--error); background: rgba(255, 77, 77, 0.1); padding: 10px; margin-bottom: 10px; color: #ffcccc; }
        .success-item { border-left: 4px solid #27ae60; background: rgba(39, 174, 96, 0.1); padding: 10px; margin-bottom: 5px; color: #ccffcc; }

        .btn { cursor: pointer; border: none; padding: 15px; border-radius: 50px; font-weight: bold; width: 100%; text-transform: uppercase; margin-top: 10px; }
        .btn-repair { background: var(--gold); color: black; font-size: 1.1em; }
        .btn-copy { background: white; color: black; }

        #preview-media { margin-top: 30px; border-top: 2px solid var(--gold); padding-top: 20px; text-align: left; }
        .card { background: #111; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #222; }
        img { max-width: 100%; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ LE RESTAURATEUR DE STRUCTURE</h1>
    
    <div class="layout">
        <div>
            <label>📥 COLLEZ LE CODE TOTAL (MÊME CASSÉ) :</label>
            <textarea id="inputJSON" placeholder="Collez votre JSON complet ici..."></textarea>
            <button class="btn btn-repair" onclick="restaurer()">🛠️ ANALYSER & RÉPARER LA TOTALITÉ</button>
        </div>
        <div>
            <label>📤 CODE PURIFIÉ & RÉALIGNE :</label>
            <textarea id="outputJSON" readonly></textarea>
            <button class="btn btn-copy" onclick="copier()">⚡ COPIER LE RÉSULTAT FINAL</button>
        </div>
    </div>

    <div class="diagnostic-box">
        <h3>🔍 DIAGNOSTIC DE JUSTICE (Ligne par Ligne)</h3>
        <div id="diagLog">En attente d'analyse...</div>
    </div>

    <div id="preview-media"></div>
</div>

<script>
    function restaurer() {
        let raw = document.getElementById('inputJSON').value.trim();
        const diag = document.getElementById('diagLog');
        const out = document.getElementById('outputJSON');
        const preview = document.getElementById('preview-media');
        
        diag.innerHTML = "";
        preview.innerHTML = "";
        
        // --- ÉTAPE 1 : DÉCOUPAGE CHIRURGICAL ---
        // On sépare par le mot "id" pour isoler chaque bloc
        let fragments = raw.split(/"id"\s*:/);
        let validMessages = [];
        
        if (fragments.length <= 1) {
            diag.innerHTML = "<div class='error-item'>❌ AUCUN MESSAGE DÉTECTÉ. Vérifiez que vous avez bien des champs 'id'.</div>";
            return;
        }

        diag.innerHTML += `<div class='success-item'>✔️ Analyse de ${fragments.length - 1} blocs potentiels...</div>`;

        // On traite chaque fragment (le premier est souvent vide ou contient l'entête)
        for (let i = 1; i < fragments.length; i++) {
            let chunk = '"id":' + fragments[i];
            
            // On tente de nettoyer le chunk pour qu'il ressemble à un objet { ... }
            let cleanChunk = chunk.trim();
            if (!cleanChunk.startsWith('{')) cleanChunk = '{' + cleanChunk;
            
            // On enlève les virgules ou crochets qui traînent à la fin
            cleanChunk = cleanChunk.replace(/[,\]}]+$/, ''); 
            cleanChunk = cleanChunk + '}'; // On ferme proprement

            try {
                let obj = JSON.parse(cleanChunk);
                validMessages.push(obj);
                diag.innerHTML += `<div class='success-item'>🔹 Message ID ${obj.id || i} : Structure Purifiée.</div>`;
            } catch (e) {
                diag.innerHTML += `<div class='error-item'>🔴 RUPTURE DÉTECTÉE près de l'ID situé en position ${i}. Vérifiez les guillemets ou les virgules internes.</div>`;
            }
        }

        // --- ÉTAPE 2 : RÉORDONNER (ASCENDANT) ---
        if (validMessages.length > 0) {
            validMessages.sort((a, b) => a.id - b.id); // On remet dans l'ordre numérique
            
            // On applique la logique de date si nécessaire ou on laisse tel quel
            let finalJSON = {
                status: "online",
                messages: validMessages
            };
            
            out.value = JSON.stringify(finalJSON, null, 2);
            
            // --- ÉTAPE 3 : VISIONNAGE ---
            validMessages.forEach(m => {
                preview.innerHTML += `
                    <div class="card">
                        <div style="color:var(--gold); font-weight:bold;">${m.titre || 'SANS TITRE'} (ID: ${m.id})</div>
                        <div style="font-size:0.8em; color:#666;">${m.date}</div>
                        ${m.image ? `<img src="${m.image}">` : ''}
                        ${m.audio ? `<audio controls src="${m.audio}" style="width:100%"></audio>` : ''}
                        <p style="font-size:0.9em; white-space:pre-wrap;">${m.texte ? m.texte.substring(0, 150) : ''}...</p>
                    </div>
                `;
            });
        }
    }

    function copier() {
        document.getElementById('outputJSON').select();
        document.execCommand('copy');
        alert("🎯 CODE TOTAL RÉPARÉ COPIÉ !");
    }
</script>

</body>
</html>
