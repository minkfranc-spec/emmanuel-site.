<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN MULTIMÉDIA | Emmanuel DPV</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; padding: 10px; text-align: center; margin: 0; }
        .admin-box { max-width: 900px; margin: auto; background: var(--card); padding: 25px; border-radius: 25px; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); margin-bottom: 40px; }
        h1 { color: var(--gold); font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px; }
        
        textarea { width: 100%; height: 250px; border-radius: 15px; border: 1px solid #444; padding: 15px; background: #000; color: #00ff00; font-family: 'Courier New', monospace; box-sizing: border-box; font-size: 14px; transition: 0.3s; resize: vertical; margin-bottom: 10px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { cursor: pointer; border: none; border-radius: 50px; font-weight: bold; transition: 0.3s; padding: 15px; text-transform: uppercase; font-size: 0.85em; }
        .btn-view { background: #2980b9; color: white; }
        .btn-fix { background: var(--gold); color: black; }
        .btn-copy { background: #fff; color: #000; width: 100%; margin-top: 10px; }

        #preview-container { max-width: 800px; margin: auto; text-align: left; padding: 20px; border-top: 2px dashed var(--gold); }
        .msg-card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 20px; margin-bottom: 25px; overflow: hidden; }
        .msg-header { color: var(--gold); font-weight: bold; font-size: 1.2em; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .msg-meta { font-size: 0.8em; color: #777; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        
        .preview-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        audio { width: 100%; height: 35px; margin: 10px 0; border-radius: 5px; filter: sepia(20%) saturate(70%) grayscale(1) contrast(99%) invert(12%); }
        
        .msg-text { line-height: 1.7; white-space: pre-wrap; color: #ddd; font-size: 0.95em; }
        .msg-badge { background: var(--gold); color: black; padding: 2px 10px; border-radius: 5px; font-size: 0.7em; }
        .highlight-text { color: var(--gold); font-weight: bold; }
        
        .example-json { background: #222; padding: 15px; border-radius: 10px; margin: 10px 0; font-size: 0.9em; text-align: left; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>🏛️ COMMANDE MULTIMÉDIA</h1>
    <div style="text-align: left;">
        <label style="color: var(--gold); font-weight: bold;">📥 COLLEZ VOTRE CODE :</label>
        <textarea id="inputJSON" placeholder="Collez ici votre JSON... Exemple ci-dessous pour tester 👇">[{"id":1,"titre":"Bienvenue","date":"2026-02-11","categorie":"Accueil","texte":"Message de test avec **mise en évidence** !","image":"","audio":""}]</textarea>
        <div class="example-json">Exemple JSON valide pour tester immédiatement.</div>
        <div class="btn-group">
            <button class="btn btn-view" onclick="traiter(false)">👁️ VISIONNER</button>
            <button class="btn btn-fix" onclick="traiter(true)">⚖️ RÉORDONNER (BAS → HAUT)</button>
        </div>
    </div>
    <div style="text-align: left;">
        <label style="color: var(--gold); font-weight: bold;">📤 SORTIE :</label>
        <textarea id="outputJSON" readonly></textarea>
        <button class="btn btn-copy" onclick="copier()">⚡ COPIER LE RÉSULTAT</button>
    </div>
</div>

<h2 style="color: var(--gold);">👁️ APERÇU</h2>
<div id="preview-container">
    <p style="color: #777;">Cliquez VISIONNER pour voir l'aperçu ou collez votre JSON.</p>
</div>

<script>
    let formatComplet = false;

    function purifier(str) {
        let s = str.trim();
        formatComplet = s.startsWith('{') && s.includes('"messages"');
        if (!s.startsWith('[') && !s.startsWith('{')) s = '[' + s + ']';
        else if (s.startsWith('{') && !formatComplet) s = '[' + s + ']';
        return s.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']').replace(/}\s*{/g, '},{');
    }

    function traiter(doitReorganiser) {
        let raw = document.getElementById('inputJSON').value.trim();
        if (!raw) {
            alert('📝 Collez un JSON d\'abord !');
            return;
        }
        try {
            let clean = purifier(raw);
            let parsed = JSON.parse(clean);
            let msgs = formatComplet ? parsed.messages : (Array.isArray(parsed) ? parsed : [parsed]);

            if (doitReorganiser && msgs.length > 0) {
                let lastIndex = msgs.length - 1;
                let currentId = parseInt(msgs[lastIndex].id) || 1;
                let currentDate = new Date(msgs[lastIndex].date || Date.now());
                if (isNaN(currentDate.getTime())) currentDate = new Date();

                for (let i = lastIndex - 1; i >= 0; i--) {
                    currentId++;
                    currentDate.setDate(currentDate.getDate() + 1);
                    msgs[i].id = currentId;
                    msgs[i].date = currentDate.toISOString().split('T')[0];
                }
            }
            
            let finalData = formatComplet ? {status: "online", messages: msgs} : msgs;
            document.getElementById('outputJSON').value = JSON.stringify(finalData, null, 2);
            renderPreview(msgs);
        } catch (e) {
            alert('❌ ERREUR JSON : ' + e.message);
            console.error(e);
        }
    }

    function renderPreview(msgs) {
        const container = document.getElementById('preview-container');
        if (!msgs || msgs.length === 0) {
            container.innerHTML = '<p style="color: #777;">Aucun message à afficher.</p>';
            return;
        }
        container.innerHTML = '';
        msgs.forEach(m => {
            let card = document.createElement('div');
            card.className = 'msg-card';
            let imgHtml = m.image ? `<img src="${m.image}" class="preview-img" onerror="this.style.display=\'none\';" alt="Image">` : '';
            let audioHtml = m.audio ? `<audio controls src="${m.audio}"></audio>` : '';
            let textePreview = (m.texte || '').replace(/\*\*(.*?)\*\*/g, '<span class="highlight-text">$1</span>');
            
            card.innerHTML = `
                ${imgHtml}
                <div class="msg-header">
                    <span>${m.titre || 'Sans titre'}</span>
                    <span class="msg-badge">ID: ${m.id || 'N/A'}</span>
                </div>
                <div class="msg-meta">📅 ${m.date || 'N/A'} | 🏷️ ${m.categorie || 'N/A'}</div>
                ${audioHtml}
                <div class="msg-text">${textePreview}</div>
            `;
            container.appendChild(card);
        });
    }

    function copier() {
        const output = document.getElementById('outputJSON');
        output.select();
        document.execCommand('copy');
        alert('🎯 COPIÉ !');
    }

    // Auto-test au chargement pour éviter blocage
    window.addEventListener('load', function() {
        const input = document.getElementById('inputJSON');
        if (input.value.trim()) {
            setTimeout(() => traiter(false), 500);
        }
        console.log('🚀 Admin Multimédia chargé !');
    });
</script>
</body>
</html>
