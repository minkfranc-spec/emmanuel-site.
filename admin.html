<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EMMANUEL | Créateur & Organisateur Royal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; color: #1a1a1a; }
        .container { max-width: 1000px; margin: auto; }
        .box { background: white; padding: 30px; border-radius: 20px; border-top: 10px solid #d4af37; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 150px; font-family: 'Georgia', serif; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #d4af37; }

        .json-output { background: #1a1a1a; color: #00ff00; padding: 20px; border-radius: 10px; font-family: 'Courier New', monospace; white-space: pre-wrap; margin-top: 20px; display: none; }
        
        .btn { background: #1a1a1a; color: white; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #d4af37; }
        .btn-copy { background: #d4af37; margin-top: 10px; display: none; }

        /* Ascenseur */
        #scrollToTop { position: fixed; bottom: 30px; right: 30px; background: #d4af37; color: white; width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; display: none; font-size: 24px; z-index: 1000; }
    </style>
</head>
<body>

<div class="container">
    <div class="box">
        <h1>🏛️ CRÉATEUR DE MESSAGE</h1>
        <div class="form-grid">
            <div>
                <label>ID (Numéro du message)</label>
                <input type="number" id="m_id" placeholder="Ex: 12">
                <label>Date (AAAA-MM-JJ)</label>
                <input type="date" id="m_date">
                <label>Lien de l'image</label>
                <input type="text" id="m_img" placeholder="https://i.postimg.cc/...">
                <label>Catégories (FR)</label>
                <input type="text" id="m_cat_fr" placeholder="FOI, SAGESSE">
                <label>Categories (EN)</label>
                <input type="text" id="m_cat_en" placeholder="FAITH, WISDOM">
            </div>
            <div>
                <label>Titre (FR)</label>
                <input type="text" id="m_titre_fr" placeholder="Titre en français">
                <label>Title (EN)</label>
                <input type="text" id="m_titre_en" placeholder="Title in English">
                <label>Texte (FR)</label>
                <textarea id="m_txt_fr" placeholder="Texte en français..."></textarea>
                <label>Text (EN)</label>
                <textarea id="m_txt_en" placeholder="Text in English..."></textarea>
            </div>
        </div>
        <button class="btn" onclick="genererJSON()">⚡ GÉNÉRER LE BLOC JSON</button>
        <div id="jsonResult" class="json-output"></div>
        <button id="copyBtn" class="btn btn-copy" onclick="copierJSON()">📋 COPIER LE CODE</button>
    </div>

    <div class="box">
        <h1>🛠️ ORGANISATEUR GLOBAL</h1>
        <p>Collez votre fichier <b>data.json</b> entier ici pour synchroniser les dates.</p>
        <textarea id="fullJson" style="height: 200px; font-family: monospace;" placeholder="[ { ... }, { ... } ]"></textarea>
        <button class="btn" onclick="organiserGlobal()">🔄 SYNCHRONISER & APERÇU</button>
    </div>
</div>

<button id="scrollToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

<script>
    function genererJSON() {
        const obj = {
            id: parseInt(document.getElementById('m_id').value),
            date: document.getElementById('m_date').value,
            categorie: document.getElementById('m_cat_fr').value,
            categorie_en: document.getElementById('m_cat_en').value,
            titre: document.getElementById('m_titre_fr').value,
            titre_en: document.getElementById('m_titre_en').value,
            image: document.getElementById('m_img').value,
            texte: document.getElementById('m_txt_fr').value,
            texte_en: document.getElementById('m_txt_en').value
        };
        const result = JSON.stringify(obj, null, 2);
        document.getElementById('jsonResult').innerText = result;
        document.getElementById('jsonResult').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
    }

    function copierJSON() {
        const text = document.getElementById('jsonResult').innerText;
        navigator.clipboard.writeText(text);
        alert("Bloc JSON copié ! Ajoutez-le à votre fichier global.");
    }

    function organiserGlobal() {
        const area = document.getElementById('fullJson');
        try {
            let data = JSON.parse(area.value);
            // Calcul chronologique comme on l'a fait aujourd'hui
            let indexDernier = data.length - 1;
            let idRef = parseInt(data[indexDernier].id);
            let dateRef = new Date(data[indexDernier].date);

            for (let i = indexDernier - 1; i >= 0; i--) {
                idRef++; 
                dateRef.setDate(dateRef.getDate() + 1);
                data[i].id = idRef;
                data[i].date = dateRef.toISOString().split('T')[0];
            }
            area.value = JSON.stringify(data, null, 2);
            alert("Fichier synchronisé avec succès !");
        } catch(e) { alert("Erreur dans le JSON global"); }
    }

    window.onscroll = function() {
        document.getElementById("scrollToTop").style.display = window.scrollY > 300 ? "block" : "none";
    };
</script>
</body>
</html>
