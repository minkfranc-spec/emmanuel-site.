<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EMMANUEL | Administrateur de Saisie</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; color: #1a1a1a; }
        .admin-box { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; border-top: 10px solid #d4af37; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a1a1a; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .col { display: flex; flex-direction: column; }
        
        label { font-weight: bold; margin: 10px 0 5px; color: #d4af37; font-size: 0.9em; }
        input, textarea { padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #d4af37; background: #fffdf5; }
        textarea { height: 120px; resize: vertical; font-family: 'Georgia', serif; }

        .btn-add { background: #1a1a1a; color: white; padding: 15px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 16px; transition: 0.3s; width: 100%; }
        .btn-add:hover { background: #d4af37; transform: translateY(-2px); }

        .result-zone { margin-top: 40px; }
        #jsonOutput { width: 100%; height: 300px; background: #1a1a1a; color: #00ff00; font-family: 'Courier New', monospace; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .btn-copy { background: #d4af37; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>📝 SAISIE DES MESSAGES</h1>
    
    <div class="grid">
        <div class="col">
            <label>🆔 ID du message</label>
            <input type="number" id="id" placeholder="Ex: 15">
            
            <label>📅 Date de parution</label>
            <input type="date" id="date">
            
            <label>🖼️ URL de l'image</label>
            <input type="text" id="image" placeholder="Lien catbox ou postimg...">
            
            <label>🏷️ Catégories (FR)</label>
            <input type="text" id="cat_fr" placeholder="FOI, SAGESSE">
            
            <label>🏷️ Categories (EN)</label>
            <input type="text" id="cat_en" placeholder="FAITH, WISDOM">
        </div>
        <div class="col">
            <label>🏆 Titre (FR)</label>
            <input type="text" id="titre_fr" placeholder="Titre en français">
            
            <label>🏆 Title (EN)</label>
            <input type="text" id="titre_en" placeholder="Title in English">
            
            <label>📖 Message (FR)</label>
            <textarea id="txt_fr" placeholder="Écrivez le message ici..."></textarea>
            
            <label>📖 Message (EN)</label>
            <textarea id="txt_en" placeholder="Write the message here..."></textarea>
        </div>
    </div>

    <button class="btn-add" onclick="ajouterAuFlux()">⚡ AJOUTER AU FICHIER JSON</button>

    <div class="result-zone">
        <label>💎 FICHIER DATA.JSON FINAL (Ordre Décroissant)</label>
        <button class="btn-copy" onclick="copierFlux()">Copier tout le JSON</button>
        <textarea id="jsonOutput" readonly></textarea>
    </div>
</div>

<script>
    let listeMessages = [];

    function ajouterAuFlux() {
        // 1. Récupération des données
        const nouveauMsg = {
            id: parseInt(document.getElementById('id').value),
            date: document.getElementById('date').value,
            categorie: document.getElementById('cat_fr').value,
            categorie_en: document.getElementById('cat_en').value,
            titre: document.getElementById('titre_fr').value,
            titre_en: document.getElementById('titre_en').value,
            image: document.getElementById('image').value,
            texte: document.getElementById('txt_fr').value,
            texte_en: document.getElementById('txt_en').value
        };

        if(!nouveauMsg.id || !nouveauMsg.titre) {
            alert("Maître, l'ID et le Titre sont obligatoires !");
            return;
        }

        // 2. Ajout et Tri (ID le plus élevé en haut)
        listeMessages.push(nouveauMsg);
        listeMessages.sort((a, b) => b.id - a.id);

        // 3. Mise à jour de l'affichage JSON
        document.getElementById('jsonOutput').value = JSON.stringify(listeMessages, null, 2);

        // 4. Nettoyage des champs pour la saisie suivante
        document.getElementById('id').value = "";
        document.getElementById('titre_fr').value = "";
        document.getElementById('titre_en').value = "";
        document.getElementById('txt_fr').value = "";
        document.getElementById('txt_en').value = "";
        
        // On garde la date et l'image par défaut pour gagner du temps
        document.getElementById('id').focus();
    }

    function copierFlux() {
        const copyText = document.getElementById("jsonOutput");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("JSON copié avec succès, mon Maître !");
    }
</script>

</body>
</html>
