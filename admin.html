<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🕯️ Admin Emmanuel - Cloudflare</title>
    <style>
        :root{--g:#d4af37;--b:#121212;--c:#1e1e1e;--t:#f4f4f4}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Segoe UI,sans-serif;background:var(--b);color:var(--t);padding:20px}
        .c{max-width:1100px;margin:auto;padding:20px;border:1px solid var(--g);border-radius:15px;background:var(--c);box-shadow:0 10px 30px #0004}
        h1,h2{color:var(--g);text-align:center;text-transform:uppercase;letter-spacing:2px;margin:20px 0}
        .s{background:rgba(255,255,255,.05);padding:20px;border-radius:10px;margin-bottom:20px;border-left:4px solid var(--g)}
        textarea{width:100%;min-height:150px;background:#000;color:#0f0;border:1px solid #444;border-radius:8px;padding:12px;font:14px/1.4 Courier New,monospace;resize:vertical;margin:10px 0}
        .bg{display:flex;gap:15px;justify-content:center;margin:15px 0}
        button{padding:12px 24px;border:0;border-radius:30px;cursor:pointer;font-weight:700;text-transform:uppercase;transition:.3s}
        .bg>:first-child{background:var(--g);color:#000}
        .bg>:first-child:hover{transform:scale(1.05);background:#f0c742}
        .bg>:last-child{background:#e74c3c;color:#fff}
        .p{background:#fff;color:#333;padding:30px;border-radius:15px;margin:20px 0}
        .cv{background:#fff9e6;border:2px dashed var(--g);padding:20px;margin-bottom:20px;border-radius:10px;text-align:center;line-height:1.8; color:#000}
        .mc{border:1px solid #eee;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 4px 12px #0001;max-width:700px;margin:20px auto}
        .md{color:var(--g);font-weight:700;font-size:.85em;text-align:right}
        .mt{margin:10px 0;font-size:1.4em;text-align:center;color:#111}
        .cat{font-style:italic;color:#888;font-size:.75em;text-align:center;margin-bottom:15px;text-transform:uppercase}
        .mi{width:100%;border-radius:8px;margin-bottom:10px;box-shadow:0 4px 8px #0002}
        audio{width:100%;height:40px}
        .mb{white-space:pre-wrap;margin-top:20px;line-height:1.8;font-size:1.05em;color:#222}
        .status-tag { text-align: center; font-size: 0.8em; color: #aaa; margin-top: -10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="c">
    <h1>🕯️ Administration Emmanuel</h1>
    <div class="status-tag">📍 Connecté sur : emmanuel-dpv.pages.dev</div>

    <div class="s">
        <h2>📢 Nouveau Communiqué</h2>
        <textarea id="t" placeholder="Tapez votre texte... **gras**"></textarea>
        <div class="bg"><button onclick="a()">✨ Convertir</button></div>
    </div>

    <div class="s">
        <h2>📦 JSON Messages</h2>
        <textarea id="i" placeholder="Collez le JSON actuel ici..."></textarea>
        <div class="bg">
            <button onclick="p()">🛠️ Traiter & Synchroniser</button>
            <button onclick="v()">🗑️ Vider le cache</button>
        </div>
    </div>

    <h2>📄 JSON Final (À copier vers Cloudflare)</h2>
    <textarea id="o" readonly></textarea>

    <h2>📱 Aperçu en direct</h2>
    <div id="pr" class="p">L'aperçu de votre message s'affichera ici...</div>
</div>

<script>
let h=""; 
// Chargement automatique du cache local
window.onload=()=>{
    let m = localStorage.getItem("emmanuel_cache");
    if(m){ i.value = m; p(); }
};

// Fonction pour vider le cache
v=()=>{
    if(confirm("Voulez-vous vraiment vider l'éditeur ?")) {
        localStorage.removeItem("emmanuel_cache");
        location.reload();
    }
};

// Conversion du texte en format enrichi
a=()=>{
    if(!t.value) return alert("Le texte est vide !");
    // Remplace le gras et gère les sauts de ligne
    h = t.value.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
    p();
    alert("✓ Message converti avec succès !");
};

// Traitement global du JSON
p=()=>{
    try {
        let raw = i.value.trim();
        if(!raw) return;

        // Nettoyage JSON
        let j = raw.replace(/,\s*([}\]])/g,"$1");
        let parsed = JSON.parse(j);
        let d = Array.isArray(parsed) ? parsed : (parsed.messages || []);

        // Gestion du communiqué si présent
        if(!h && parsed.communique) h = parsed.communique;

        // Tri et ID (La Torsion temporelle pour Cloudflare)
        if(d.length > 0) {
            d.sort((a, b) => b.id - a.id);
        }

        let f = {
            status: "online",
            site: "emmanuel-dpv.pages.dev",
            communique: h,
            messages: d
        };

        o.value = JSON.stringify(f, null, 2);
        localStorage.setItem("emmanuel_cache", i.value);

        // Affichage Aperçu
        let r = h ? `<div class="cv">🔔 ${h}</div>` : "";
        d.forEach(m => {
            r += `
            <div class="mc">
                <div class="md">📅 ${m.date} | ID: ${m.id}</div>
                <div class="mt">🌟 <b>${m.titre}</b></div>
                <div class="cat">${m.categorie || 'ENSEIGNEMENT'}</div>
                <div>
                    ${m.image ? `<img src="${m.image}" class="mi" onerror="this.style.display='none'">` : ""}
                    ${m.audio ? `<audio controls class="mi"><source src="${m.audio}"></audio>` : ''}
                </div>
                <div class="mb">${m.texte.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")}</div>
            </div>`;
        });
        pr.innerHTML = r;
    } catch(e) {
        console.error(e);
        alert("❌ Oups ! Le JSON semble invalide. Vérifiez les virgules.");
    }
}
</script>
</body>
</html>
