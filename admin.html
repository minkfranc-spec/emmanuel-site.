<script>
    let fluxGlobal = { status: "online", messages: [] };

    // 1. Charger les données actuelles depuis GitHub
    function chargerDonnees() {
        const raw = document.getElementById('inputJSON').value.trim();
        try {
            const parsed = JSON.parse(raw);
            // On s'assure de bien séparer le status et la liste des messages
            if (parsed.messages) {
                fluxGlobal.status = parsed.status || "online";
                fluxGlobal.messages = parsed.messages;
            } else {
                // Si on colle une ancienne version sans status
                fluxGlobal.messages = Array.isArray(parsed) ? parsed : [];
                fluxGlobal.status = "online";
            }
            actualiserInterface();
            alert("✅ Système chargé et prêt !");
        } catch (e) {
            alert("❌ Erreur : Collez bien tout le contenu de votre fichier data.json");
        }
    }

    // 2. LE BOUTON MAGIQUE (Basculer Stand-by)
    function basculerStandBy() {
        if (fluxGlobal.status === "online") {
            fluxGlobal.status = "standby";
        } else {
            fluxGlobal.status = "online";
        }
        
        // On force la reconstruction du texte final immédiatement
        actualiserInterface();
        
        // Petit message pour confirmer l'action du bouton
        const mode = fluxGlobal.status === "online" ? "OUVERT 🟢" : "FERMÉ (Stand-by) 🔴";
        alert("Bouton magique activé : Le site est maintenant " + mode);
    }

    function actualiserInterface() {
        const ind = document.getElementById('statusInd');
        if (fluxGlobal.status === "standby") {
            ind.innerText = "● MODE STAND-BY ACTIVÉ";
            ind.className = "status-indicator standby";
        } else {
            ind.innerText = "● SITE EN LIGNE";
            ind.className = "status-indicator online";
        }
        
        // Génère le JSON propre avec le nouveau statut
        document.getElementById('outputJSON').value = JSON.stringify(fluxGlobal, null, 2);
    }
</script>
