<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🕯️ Admin Emmanuel</title>
<style>
:root{--g:#d4af37;--b:#121212;--c:#1e1e1e;--t:#f4f4f4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:var(--b);color:var(--t);padding:20px}
.c{max-width:1100px;margin:auto;padding:20px;border:1px solid var(--g);border-radius:15px;background:var(--c);box-shadow:0 10px 30px #0004}
h1,h2{color:var(--g);text-align:center;text-transform-uppercase;letter-spacing:2px;margin:20px 0}
.s{background:rgba(255,255,255,.05);padding:20px;border-radius:10px;margin-bottom:20px;border-left:4px solid var(--g)}
textarea{width:100%;min-height:150px;background:#000;color:#0f0;border:1px solid #444;border-radius:8px;padding:12px;font:14px/1.4 Courier New,monospace;resize:vertical;margin:10px 0}
.editor{min-height:200px;border:2px solid #444;border-radius:10px;padding:20px;background:#111;color:#fff;white-space:pre-wrap;font-family:Georgia,serif;line-height:1.6;font-size:16px;position:relative}
.editor:focus{border-color:var(--g);outline:0;box-shadow:0 0 0 3px rgba(212,175,55,.2)}
.editor::placeholder{color:#666}
.format-bar{position:absolute;top:-45px;left:0;display:flex;gap:10px;background:var(--c);padding:8px;border-radius:20px 20px 5px 5px;border:1px solid var(--g)}
.format-btn{padding:6px 12px;background:var(--g);color:#000;border:0;border-radius:15px;font-size:12px;cursor:pointer;font-weight:700}
.format-btn:hover{background:#f0c742}
.bg{display:flex;gap:15px;justify-content:center;margin:15px 0;flex-wrap:wrap}
button{padding:12px 24px;border:0;border-radius:30px;cursor:pointer;font-weight:700;text-transform:uppercase;transition:.3s;flex:1;max-width:200px}
.bg>:first-child{background:var(--g);color:#000}
.bg>:first-child:hover{transform:scale(1.05);background:#f0c742}
.bg>:last-child{background:#e74c3c;color:#fff}
.p{background:#fff;color:#333;padding:30px;border-radius:15px;margin:20px 0;min-height:200px}
.cv{background:#fff9e6;border:2px dashed var(--g);padding:20px;margin-bottom:20px;border-radius:10px;text-align:center;line-height:1.8}
.mc{border:1px solid #eee;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 4px 12px #0001;max-width:700px;margin:20px auto}
.md{color:var(--g);font-weight:700;font-size:.85em;text-align:right}
.mt{margin:10px 0;font-size:1.4em;text-align:center;color:#111}
.cat{font-style:italic;color:#888;font-size:.75em;text-align:center;margin-bottom:15px;text-transform:uppercase}
.mi{width:100%;border-radius:8px;margin-bottom:10px;box-shadow:0 4px 8px #0002}
audio{width:100%;height:40px}
.mb{white-space:pre-wrap;margin-top:20px;line-height:1.8;font-size:1.05em;color:#222}
.status-ok{color:#0f0;font-weight:700}
.status-err{color:#f44}
.preview-comm{padding:20px;background:#f8f8f8;border-radius:8px;margin-top:10px;border-left:4px solid var(--g);display:none}
</style>
</head>
<body>
<div class="c">
<h1>🕯️ Administration Emmanuel</h1>

<div class="s">
<h2>📢 Éditeur Communiqué (WYSIWYG)</h2>
<div class="format-bar">
<button class="format-btn" onclick="formatBold()">𝐁</button>
<button class="format-btn" onclick="formatItalic()">𝐈</button>
<button class="format-btn" onclick="formatLine()">↵</button>
</div>
<div contenteditable="true" id="editor" class="editor" placeholder="Écrivez naturellement ici...\n\n**Ceci sera en gras**\n\n*Ceci en italique*\n\nChaque retour à la ligne = &lt;br&gt;\n\nCliquez B/I ou Ctrl+B/Ctrl+I pour formater"
oninput="livePreview()" onkeydown="handleKey(event)">Écrivez votre communiqué ici...
</div>
<div class="preview-comm" id="commPreview"></div>
<div class="bg"><button onclick="a()">✨ Convertir & Appliquer</button></div>
</div>

<div class="s">
<h2>📦 JSON Messages</h2>
<textarea id="i" placeholder='[{"id":1,"date":"2026-02-27","titre":"Test","categorie":"Info","texte":"Contenu","image":"","audio":""}]\nor {"messages":[...],"communique":"..."}'></textarea>
<div class="bg"><button onclick="p()">🛠️ Traiter & Corriger</button><button onclick="v()">🗑️ Vider Cache</button></div>
</div>

<h2>📄 JSON Final <span id="status"></span></h2>
<textarea id="o" readonly></textarea>

<h2>📱 Aperçu Site</h2>
<div id="pr" class="p"><div style="text-align:center;color:#999;padding:40px">Aperçu s'affiche ici...</div></div>
</div>

<script>
let h="",isLoaded=!1;
const editor=document.getElementById("editor");
const commPreview=document.getElementById("commPreview");

const fixJson=jsonStr=>{
 try{
  let clean=jsonStr.trim()
   .replace(/,\s*([}\]])/g,"$1")
   .replace(/([{,]\s*)"([^"]*)"\s*:/g,'$1"$2":')
   .replace(/\\"/g,'"')
   .replace(/'''/g,'"');
  return JSON.parse(clean);
 }catch(e){throw new Error("JSON invalide après correction");}
};

const formatText=text=>{
 if(!text)return"";
 return text
  .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
  .replace(/\*(.*?)\*/g,"<i>$1</i>")
  .replace(/\n/g,"<br>");
};

const livePreview=()=>{
 let html=formatText(editor.textContent);
 commPreview.innerHTML=html;
 commPreview.style.display=html?"block":"none";
};

const formatBold=()=>{
 document.execCommand('bold');
 editor.focus();
 livePreview();
};

const formatItalic=()=>{
 document.execCommand('italic');
 editor.focus();
 livePreview();
};

const formatLine=()=>{
 let txt=editor.textContent;
 if(!txt.includes('\n\n'))editor.innerHTML+='<br><br>';
 editor.focus();
};

const handleKey=e=>{
 if(e.ctrlKey){
  if(e.key==='b'){e.preventDefault();formatBold();}
  if(e.key==='i'){e.preventDefault();formatItalic();}
 }
};

window.onload=()=>{
 let m=localStorage.getItem("emmanuel_cache");
 if(m){
  i.value=m;
  p();
  isLoaded=!0;
 }
 livePreview();
};

v=()=>{
 if(confirm("🗑️ Effacer tout le cache ?")){
  localStorage.removeItem("emmanuel_cache");
  i.value=o.value="";pr.innerHTML='<div style="text-align:center;color:#999;padding:40px">Cache vidé !</div>';
  status.textContent="";h="";
  editor.textContent="";
  commPreview.style.display="none";
  alert("✓ Cache vidé");
 }
};

a=()=>{
 h=formatText(editor.textContent.trim());
 if(!h){alert("⚠️ Écrivez d'abord votre communiqué");return;}
 p();
 setTimeout(()=>alert("✨ Communiqué formaté & appliqué !"),100);
};

p=()=>{
 try{
  let s=document.getElementById("status");
  s.textContent="🔄 Traitement...";s.className="status-ok";
  
  let raw=i.value.trim();
  if(!raw)return alert("📝 Entrez du JSON");
  
  let data=fixJson(raw);
  let messages=Array.isArray(data)?data:data.messages||[];
  if(!Array.isArray(messages))throw new Error("Aucun tableau 'messages'");
  
  if(!h&&data.communique)h=formatText(data.communique);
  
  if(messages.length===0)return alert("📭 Aucun message");
  
  let last=messages[messages.length-1];
  if(!last.id||!last.date)throw new Error("Dernier msg sans id/date");
  
  let id=parseInt(last.id)||1,dt=new Date(last.date);
  if(isNaN(dt))dt=new Date();
  
  for(let k=messages.length-1;k>=0;k--){
   messages[k].id=id;
   messages[k].date=dt.toISOString().split`T`[0];
   id++;dt.setDate(dt.getDate()+1);
  }
  
  messages.sort((a,b)=>b.id-a.id);
  
  let final={status:"online",communique:h||"",messages};
  o.value=JSON.stringify(final,null,2);
  localStorage.setItem("emmanuel_cache",raw);
  
  let r=h?`<div class="cv">${h}</div>`:"";
  messages.forEach(m=>{
   r+=`
   <div class="mc">
    <div class="md">📅 ${m.date} | ID:${m.id}</div>
    <div class="mt">${m.titre||'Sans titre'}</div>
    <div class="cat">${m.categorie||'Non catégorisé'}</div>
    <div class="msg-media">
     ${m.image?`<img src="${m.image}" class="mi" onerror="this.style.display='none'" alt="Image">`:""}
     ${m.audio?`<audio controls><source src="${m.audio}" type="audio/mpeg"></audio>`:""}
    </div>
    <div class="mb">${formatText(m.texte||"")}</div>
   </div>`;
  });
  pr.innerHTML=r;
  s.textContent=`✓ ${messages.length} msg(s) + communiqué`;
  
 }catch(e){
  let s=document.getElementById("status");
  s.textContent="❌ "+e.message;s.className="status-err";
  o.value="ERREUR:\n"+e.message;
  alert("❌ "+e.message);
 }
};
</script>
</body></html>
