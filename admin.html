<script>
    // Initialisation avec la structure exacte attendue par index.html
    let fluxGlobal = { 
        status: "online", 
        messages: [] 
    };

    // 1. Charger les données actuelles depuis GitHub
    function chargerDonnees() {
        const inputField = document.getElementById('inputJSON');
        const raw = inputField.value.trim();
        
        if (!raw) {
            alert("⚠️ La case est vide. Collez le contenu de data.json d'abord.");
            return;
        }

        try {
            const parsed = JSON.parse(raw);
            
            // On détecte la structure et on normalise
            if (parsed.messages && Array.isArray(parsed.messages)) {
                fluxGlobal.messages = parsed.messages;
                fluxGlobal.status = parsed.status || "online";
            } else if (Array.isArray(parsed)) {
                fluxGlobal.messages = parsed;
                fluxGlobal.status = "online";
            } else {
                throw new Error("Structure inconnue");
            }

            actualiserInterface();
            alert("✅ Données synchronisées. Le bouton magique est prêt !");
        } catch (e) {
            alert("❌ Erreur de format. Assurez-vous de copier TOUT le texte du fichier sur GitHub.");
        }
    }

    // 2. LE BOUTON MAGIQUE (Injection de l'ordre de fermeture)
    function basculerStandBy() {
        // Inversion du statut
        fluxGlobal.status = (fluxGlobal.status === "online") ? "standby" : "online";
        
        // Reconstruction immédiate
        actualiserInterface();
        
        const emoji = fluxGlobal.status === "online" ? "🟢 EN LIGNE" : "🔴 STAND-BY";
        alert("Bouton Magique : Statut basculé sur " + emoji + ".\n\nCopiez maintenant le résultat vers GitHub !");
    }

    // 3. Mise à jour visuelle et technique
    function actualiserInterface() {
        const ind = document.getElementById('statusInd');
        const out = document.getElementById('outputJSON');

        // Mise à jour du voyant
        if (fluxGlobal.status === "standby") {
            ind.innerText = "● MODE STAND-BY ACTIVÉ";
            ind.style.background = "#c0392b"; // Rouge
            ind.className = "status-indicator standby";
        } else {
            ind.innerText = "● SITE EN LIGNE";
            ind.style.background = "#27ae60"; // Vert
            ind.className = "status-indicator online";
        }
        
        // On génère le JSON final que Cloudflare/index.html va lire
        // On s'assure que status est bien à la racine du JSON
        const jsonFinal = {
            status: fluxGlobal.status,
            messages: fluxGlobal.messages
        };

        out.value = JSON.stringify(jsonFinal, null, 2);
    }
</script>
