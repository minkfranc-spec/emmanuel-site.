<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMMANUEL | Administrateur Suprême</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f0f2f5; padding: 20px; }
        .admin-box { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid #d4af37; }
        .status-panel { background: #1a1a1a; color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .status-indicator { font-size: 1.2em; font-weight: bold; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 15px; }
        .online { background: #27ae60; } .standby { background: #c0392b; }
        textarea { width: 100%; height: 150px; border-radius: 10px; border: 1px solid #ddd; padding: 10px; font-family: monospace; background: #fafafa; }
        .btn { cursor: pointer; border: none; border-radius: 50px; font-weight: bold; transition: 0.3s; padding: 15px 30px; text-transform: uppercase; }
        .btn-status { background: #d4af37; color: white; margin-top: 10px; }
        .btn-copy { background: #1a1a1a; color: white; width: 100%; margin-top: 20px; font-size: 1.1em; }
        .zone-reparation { margin-top: 30px; border: 2px dashed #d4af37; padding: 20px; border-radius: 15px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>🏛️ COMMANDE DU SANCTUAIRE</h1>

    <div class="status-panel">
        <div id="statusInd" class="status-indicator online">● SITE EN LIGNE</div><br>
        <button class="btn btn-status" onclick="basculerStandBy()">BASCULER LE MODE STAND-BY</button>
        <p style="font-size: 0.8em; opacity: 0.7; margin-top: 10px;">(Cliquez puis copiez le JSON vers data.json sur Cloudflare)</p>
    </div>

    <div class="zone-reparation">
        <label>📥 1. COLLEZ VOTRE <strong>DATA.JSON</strong> ACTUEL ICI :</label>
        <textarea id="inputJSON" placeholder="Collez le contenu de votre fichier data.json ici pour le modifier..."></textarea>
        <button class="btn btn-status" style="background:#34495e;" onclick="chargerDonnees()">CHARGER LES DONNÉES</button>
    </div>

    <div style="margin-top: 30px;">
        <label>📤 2. RÉSULTAT À COPIER DANS CLOUDFLARE :</label>
        <textarea id="outputJSON" readonly></textarea>
        <button class="btn btn-copy" onclick="copier()">⚡ COPIER LE RÉSULTAT FINAL</button>
    </div>
</div>

<script>
    let fluxGlobal = { status: "online", messages: [] };

    // 1. CHARGER LE JSON POUR NE PAS PERDRE LES MESSAGES
    function chargerDonnees() {
        const raw = document.getElementById('inputJSON').value.trim();
        try {
            const parsed = JSON.parse(raw);
            // On s'assure de bien capturer le status et les messages
            fluxGlobal.status = parsed.status || "online";
            fluxGlobal.messages = parsed.messages || [];
            
            actualiserInterface();
            alert("✅ Données chargées avec succès !");
        } catch (e) {
            alert("❌ Erreur : Le format collé n'est pas un JSON valide.");
        }
    }

    // 2. CHANGER LE MODE STAND-BY
    function basculerStandBy() {
        fluxGlobal.status = (fluxGlobal.status === "online") ? "standby" : "online";
        actualiserInterface();
    }

    // 3. METTRE À JOUR L'AFFICHAGE ET LE CODE DE SORTIE
    function actualiserInterface() {
        const ind = document.getElementById('statusInd');
        if (fluxGlobal.status === "standby") {
            ind.innerText = "● MODE STAND-BY ACTIVÉ";
            ind.className = "status-indicator standby";
        } else {
            ind.innerText = "● SITE EN LIGNE";
            ind.className = "status-indicator online";
        }
        
        // Génère le code final
        document.getElementById('outputJSON').value = JSON.stringify(fluxGlobal, null, 2);
    }

    // 4. COPIER
    function copier() {
        const out = document.getElementById('outputJSON');
        out.select();
        document.execCommand('copy');
        alert("🎯 JSON Copié ! Allez sur Cloudflare et remplacez le contenu de data.json");
    }
</script>

</body>
</html>
