<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🕯️ Admin Emmanuel</title>
<style>
/* Vos styles CSS ici - version complète */
</style>
</head>
<body>
<div class="container">
    <h1>🔧 ADMINISTRATEUR</h1>
    
    <div class="section">
        <h2>📢 Communiqué</h2>
        <textarea id="communique" placeholder="HTML autorisé: &lt;b&gt;&lt;br&gt;"></textarea>
        <small>✅ HTML passe toujours</small>
    </div>

    <div class="section">
        <h2>💎 Messages (JSON Strict)</h2>
        <textarea id="jsonMessages" class="editor" 
                  placeholder='[
  {
    "id": 1,
    "titre": "Titre sans guillemets",
    "texte": "Texte avec \\"guillemets échappés\\" et \\'apostrophes',
    "audio": "URL",
    "image": "URL"
  }
]'></textarea>
        <div class="format-bar">
            <button onclick="escapeText()">✨ Échapper Texte</button>
            <button onclick="validateJSON()">✅ Valider JSON</button>
            <button onclick="saveAll()">💾 SAUVER</button>
        </div>
    </div>

    <div class="status">
        <div id="status">⏳ Prêt</div>
    </div>
</div>

<script>
// ✅ VALIDATEUR JSON ROBUSTE
function escapeText() {
    const textarea = document.getElementById('jsonMessages');
    let content = textarea.value;
    
    // Règles strictes JSON
    content = content
        .replace(/'/g, "\\'")           // Apostrophes
        .replace(/"/g, '\\"')           // Guillemets
        .replace(/\n/g, '\\n')          // Sauts de ligne
        .replace(/\\n(?!" )/g, '\\\\n'); // Double \\n
        
    textarea.value = content;
    document.getElementById('status').textContent = '✅ Texte échappé!';
}

// ✅ VALIDATION + SAUVEGARDE
function validateJSON() {
    try {
        const messages = JSON.parse(document.getElementById('jsonMessages').value);
        const communique = document.getElementById('communique').value;
        
        const data = {
            status: 'online',
            communique: communique,
            messages: messages
        };
        
        // Sauvegarde
        localStorage.setItem('adminData', JSON.stringify(data));
        document.getElementById('status').innerHTML = '🟢 <b>SAUVEGARDÉ!</b>';
        
    } catch(e) {
        document.getElementById('status').innerHTML = '❌ JSON invalide: ' + e.message;
    }
}
</script>
</body>
</html>
