<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EMMANUEL | Organisateur Expert</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f0f0; padding: 20px; text-align: center; color: #1a1a1a; 
        }
        .box { 
            max-width: 1000px; margin: auto; background: white; padding: 35px; 
            border-radius: 20px; border-top: 10px solid #d4af37; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 40px; 
        }
        h1 { text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        
        /* --- SYSTÈME DE LIGNES NUMÉROTÉES --- */
        .editor-container {
            position: relative; border: 2px solid #ddd; border-radius: 10px;
            background: #fafafa; overflow: hidden; display: flex; text-align: left;
        }
        .line-numbers {
            width: 40px; padding: 15px 5px; border-right: 1px solid #ddd;
            background: #eee; color: #888; font-family: 'Courier New', monospace;
            font-size: 14px; text-align: right; user-select: none; line-height: 1.5;
        }
        textarea { 
            flex: 1; height: 400px; font-family: 'Courier New', monospace; 
            padding: 15px; border: none; background: transparent; 
            font-size: 14px; outline: none; line-height: 1.5; resize: none;
        }
        textarea::selection { background: #ff4d4d; color: white; }

        .btn { 
            background: #1a1a1a; color: white; padding: 18px 45px; border: none; 
            border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 25px; 
        }
        .btn:hover { background: #d4af37; }

        .error-zone { 
            display: none; margin-top: 25px; padding: 20px; background: #fff5f5; 
            border-left: 6px solid #ff4d4d; color: #b91c1c; text-align: left; border-radius: 8px; 
        }

        /* --- APERÇU --- */
        #previewArea { max-width: 850px; margin: auto; text-align: left; display: none; }
        .card { background: white; padding: 40px; border-radius: 15px; margin-bottom: 30px; border: 1px solid #ddd; }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 25px; }
        /* IDs et infos en minuscule pour repérage rapide */
        .card-meta { color: #d4af37; font-weight: bold; font-size: 0.75em; text-transform: lowercase; margin-bottom: 15px; display: block; }
        .card-title { font-size: 26px; color: #1a1a1a; margin-bottom: 20px; font-family: 'Georgia', serif; font-weight: bold; }
        .card-text { white-space: pre-wrap; line-height: 1.8; color: #333; font-size: 17px; font-family: 'Georgia', serif; }
        .card-text b { color: #000; font-weight: 900; background: rgba(212, 175, 55, 0.1); padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="box">
    <h1>🏛️ ORGANISATEUR HAUTE PRÉCISION</h1>
    <p>Numérotation active et détection par ligne/colonne. 🛡️</p>
    
    <div class="editor-container">
        <div id="lineNumbers" class="line-numbers">1</div>
        <textarea id="jsonContent" placeholder="Collez votre JSON..." oninput="updateEditor()" onscroll="syncScroll()"></textarea>
    </div>
    
    <button class="btn" onclick="lancerCalcul()">⚡ SYNCHRONISER & VÉRIFIER</button>
    
    <div id="displayError" class="error-zone"></div>
</div>

<div id="previewArea">
    <div id="previewContent"></div>
</div>

<script>
const textarea = document.getElementById('jsonContent');
const lineNumbers = document.getElementById('lineNumbers');

function updateEditor() {
    // Mise à jour des numéros de ligne
    const lines = textarea.value.split('\n').length;
    let lineNumbersHTML = '';
    for (let i = 1; i <= lines; i++) {
        lineNumbersHTML += i + '<br>';
    }
    lineNumbers.innerHTML = lineNumbersHTML;
    
    // Nettoyage erreur
    textarea.parentElement.style.borderColor = "#ddd";
    document.getElementById('displayError').style.display = 'none';
}

function syncScroll() {
    lineNumbers.scrollTop = textarea.scrollTop;
}

function lancerCalcul() {
    const zoneErreur = document.getElementById('displayError');
    const previewArea = document.getElementById('previewArea');
    const previewContent = document.getElementById('previewContent');
    
    let rawValue = textarea.value.trim();
    if (!rawValue) return;

    try {
        let data = JSON.parse(rawValue);

        // --- CALCUL CHRONOLOGIQUE ---
        let indexDernier = data.length - 1;
        let idRef = parseInt(data[indexDernier].id);
        let dateRef = new Date(data[indexDernier].date);

        for (let i = indexDernier - 1; i >= 0; i--) {
            idRef++; 
            dateRef.setDate(dateRef.getDate() + 1);
            data[i].id = idRef;
            let annee = dateRef.getFullYear();
            let mois = String(dateRef.getMonth() + 1).padStart(2, '0');
            let jour = String(dateRef.getDate()).padStart(2, '0');
            data[i].date = `${annee}-${mois}-${jour}`;
        }

        textarea.value = JSON.stringify(data, null, 2);
        updateEditor(); // Rafraîchir les numéros de ligne après formatage
        
        // --- APERÇU ---
        previewContent.innerHTML = "";
        data.forEach(msg => {
            let texteFormate = msg.texte.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            previewContent.innerHTML += `
                <div class="card">
                    <span class="card-meta">id: ${msg.id} | date: ${msg.date} | cat: ${msg.categorie}</span>
                    ${msg.image ? '<img src="'+msg.image+'" alt="image">' : ''}
                    <div class="card-title">${msg.titre}</div>
                    <div class="card-text">${texteFormate}</div>
                </div>
            `;
        });
        previewArea.style.display = "block";

    } catch (err) {
        previewArea.style.display = "none";
        textarea.parentElement.style.borderColor = "#ff4d4d";
        zoneErreur.style.display = 'block';
        
        let message = err.message;
        let match = message.match(/position (\d+)/);
        if (match) {
            let pos = parseInt(match[1]);
            let lignes = rawValue.substring(0, pos).split("\n");
            zoneErreur.innerHTML = `<strong>⚠️ ERREUR :</strong> Ligne <b>${lignes.length}</b>, Colonne <b>${lignes[lignes.length - 1].length + 1}</b>.<br>💬 ${message}`;
            textarea.focus();
            textarea.setSelectionRange(pos, pos + 1);
        } else {
            zoneErreur.innerHTML = "<strong>⚠️ ERREUR :</strong> " + message;
        }
    }
}
</script>

</body>
</html>
