<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EMMANUEL | Organisateur & Visionnaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background: #fdfdfd; padding: 20px; text-align: center; color: #1a1a1a; }
        .box { max-width: 950px; margin: auto; background: white; padding: 35px; border-radius: 20px; border-top: 10px solid #d4af37; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        textarea { width: 100%; height: 450px; font-family: 'Courier New', monospace; padding: 15px; border: 2px solid #eee; border-radius: 10px; background: #fafafa; font-size: 14px; box-sizing: border-box; outline: none; }
        /* Style pour l'erreur visuelle */
        .error-border { border: 3px solid #ff4d4d !important; background: #fff5f5 !important; }
        .btn { background: #1a1a1a; color: white; padding: 18px 45px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 25px; transition: 0.3s; }
        .btn:hover { background: #d4af37; transform: scale(1.02); }
        .error-zone { display: none; margin-top: 25px; padding: 20px; background: #fff5f5; border-left: 6px solid #ff4d4d; color: #b91c1c; text-align: left; border-radius: 8px; font-size: 14px; }
        .guide { font-size: 0.9em; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h1>🏛️ Organisateur de la Parole</h1>
    <p class="guide">Collez votre JSON. En cas d'erreur, la zone sera encadrée en rouge. 🛡️</p>
    
    <textarea id="jsonContent" placeholder="Collez votre code ici..." oninput="nettoyerErreur()"></textarea>
    
    <button class="btn" onclick="lancerCalcul()">⚡ SYNCHRONISER & VÉRIFIER</button>
    
    <div id="displayError" class="error-zone"></div>
</div>

<script>
function nettoyerErreur() {
    const zoneTexte = document.getElementById('jsonContent');
    const zoneErreur = document.getElementById('displayError');
    zoneTexte.classList.remove('error-border');
    zoneErreur.style.display = 'none';
}

function lancerCalcul() {
    const zoneTexte = document.getElementById('jsonContent');
    const zoneErreur = document.getElementById('displayError');
    
    try {
        let rawValue = zoneTexte.value.trim();
        let data = JSON.parse(rawValue);

        if (!Array.isArray(data)) {
            throw new Error("Le fichier doit commencer par [ et finir par ]");
        }

        if (data.length < 1) return;

        // --- RAISONNEMENT CHRONOLOGIQUE ---
        let indexDernier = data.length - 1;
        let idReference = parseInt(data[indexDernier].id);
        let dateReference = new Date(data[indexDernier].date);

        for (let i = indexDernier - 1; i >= 0; i--) {
            idReference++; 
            dateReference.setDate(dateReference.getDate() + 1);
            data[i].id = idReference;
            
            let annee = dateReference.getFullYear();
            let mois = String(dateReference.getMonth() + 1).padStart(2, '0');
            let jour = String(dateReference.getDate()).padStart(2, '0');
            data[i].date = `${annee}-${mois}-${jour}`;
        }

        // --- GÉNÉRATION ---
        zoneTexte.value = JSON.stringify(data, null, 2);
        alert("✅ Synchronisation réussie ! Le code est propre.");

    } catch (err) {
        // --- DÉTECTION ET SIGNALEMENT VISUEL ---
        zoneTexte.classList.add('error-border');
        zoneErreur.style.display = 'block';
        
        // Extraction de la position de l'erreur pour guider le Maître
        let message = err.message;
        let positionMatch = message.match(/position (\d+)/);
        
        if (positionMatch) {
            let pos = parseInt(positionMatch[1]);
            let texteAvant = zoneTexte.value.substring(0, pos);
            let ligne = texteAvant.split('\n').length;
            zoneErreur.innerHTML = "<strong>⚠️ ERREUR DE STRUCTURE :</strong> L'erreur se trouve vers la <b>ligne " + ligne + "</b>.<br><br>" +
                                   "<em>Conseil : Vérifiez s'il manque une virgule <code>,</code> entre deux messages ou si un guillemet est resté ouvert.</em>";
            
            // On place le curseur à l'endroit de l'erreur pour vous aider
            zoneTexte.focus();
            zoneTexte.setSelectionRange(pos - 10, pos + 10); 
        } else {
            zoneErreur.innerHTML = "<strong>⚠️ ERREUR :</strong> " + message;
        }
    }
}
</script>

</body>
</html>
