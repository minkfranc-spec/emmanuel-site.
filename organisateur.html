<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EMMANUEL | Organisateur & Visionnaire</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f0f0; 
            padding: 20px; 
            text-align: center; 
            color: #1a1a1a; 
        }
        .box { 
            max-width: 950px; 
            margin: auto; 
            background: white; 
            padding: 35px; 
            border-radius: 20px; 
            border-top: 10px solid #d4af37; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            margin-bottom: 40px; 
        }
        h1 { text-transform: uppercase; letter-spacing: 2px; color: #1a1a1a; font-weight: 900; }
        textarea { 
            width: 100%; 
            height: 350px; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            background: #fafafa; 
            font-size: 14px; 
            box-sizing: border-box; 
            outline: none; 
        }
        .error-border { border: 3px solid #ff4d4d !important; background: #fff5f5 !important; }
        .btn { 
            background: #1a1a1a; 
            color: white; 
            padding: 18px 45px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            margin-top: 25px; 
            transition: 0.3s; 
        }
        .btn:hover { background: #d4af37; transform: scale(1.02); }
        .error-zone { 
            display: none; 
            margin-top: 25px; 
            padding: 20px; 
            background: #fff5f5; 
            border-left: 6px solid #ff4d4d; 
            color: #b91c1c; 
            text-align: left; 
            border-radius: 8px; 
        }
        
        /* --- STYLE PRÉVISUALISATION RÉALISTE --- */
        #previewArea { max-width: 850px; margin: auto; text-align: left; display: none; }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            margin-bottom: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            border: 1px solid #ddd; 
        }
        .card img { 
            width: 100%; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            display: block;
        }
        .card-cat { color: #d4af37; font-weight: bold; font-size: 0.8em; text-transform: uppercase; display: block; margin-bottom: 15px; }
        .card-title { 
            font-size: 28px; 
            color: #1a1a1a; 
            margin-bottom: 25px; 
            font-family: 'Georgia', serif; 
            font-weight: bold; 
            line-height: 1.3;
        }
        .card-text { 
            white-space: pre-wrap; 
            line-height: 1.8; 
            color: #333; 
            font-size: 17px; 
            font-family: 'Georgia', serif; 
        }

        /* --- MISE EN AVANT DES THÉORÈMES (GRAS) --- */
        .card-text b, .card-text strong {
            color: #000;
            font-weight: 900;
            background: rgba(212, 175, 55, 0.1); /* Un léger fond doré pour le théorème */
            padding: 2px 4px;
            border-radius: 4px;
        }

        .preview-label { 
            font-size: 20px; 
            font-weight: bold; 
            margin: 30px 0; 
            display: block; 
            color: #d4af37; 
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🏛️ ORGANISATEUR DE THÉORÈMES</h1>
    <p>Aperçu réel avec mise en avant des passages importants. 🛡️</p>
    
    <textarea id="jsonContent" placeholder="Collez votre code JSON ici..."></textarea>
    
    <button class="btn" onclick="lancerCalcul()">⚡ SYNCHRONISER & RÉVÉLER LA PAROLE</button>
    
    <div id="displayError" class="error-zone"></div>
</div>

<div id="previewArea">
    <span class="preview-label">👁️ APERÇU FINAL (COMME SUR LE SITE)</span>
    <div id="previewContent"></div>
</div>

<script>
// Fonction pour transformer le format **gras** en HTML <b>
function formaterTheoreme(texte) {
    if (!texte) return "";
    // Remplace **texte** par <b>texte</b>
    return texte.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
}

function lancerCalcul() {
    const zoneTexte = document.getElementById('jsonContent');
    const zoneErreur = document.getElementById('displayError');
    const previewArea = document.getElementById('previewArea');
    const previewContent = document.getElementById('previewContent');
    
    zoneTexte.classList.remove('error-border');
    zoneErreur.style.display = 'none';

    try {
        let rawValue = zoneTexte.value.trim();
        if (!rawValue) return;

        let data = JSON.parse(rawValue);

        if (!Array.isArray(data)) {
            throw new Error("Le code doit commencer par [ et finir par ]");
        }

        // --- CALCUL CHRONOLOGIQUE ---
        let indexDernier = data.length - 1;
        let idRef = parseInt(data[indexDernier].id);
        let dateRef = new Date(data[indexDernier].date);

        for (let i = indexDernier - 1; i >= 0; i--) {
            idRef++; 
            dateRef.setDate(dateRef.getDate() + 1);
            data[i].id = idRef;
            
            let annee = dateRef.getFullYear();
            let mois = String(dateRef.getMonth() + 1).padStart(2, '0');
            let jour = String(dateRef.getDate()).padStart(2, '0');
            data[i].date = `${annee}-${mois}-${jour}`;
        }

        zoneTexte.value = JSON.stringify(data, null, 2);
        
        // --- APERÇU AVEC THÉORÈMES EN GRAS ---
        previewContent.innerHTML = "";
        data.forEach(msg => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // On applique le formaterTheoreme sur le texte
            let texteFormate = formaterTheoreme(msg.texte);

            card.innerHTML = `
                <span class="card-cat">${msg.categorie} | ID: ${msg.id} | ${msg.date}</span>
                ${msg.image ? '<img src="'+msg.image+'" alt="[Image]">' : ''}
                <div class="card-title">${msg.titre}</div>
                <div class="card-text">${texteFormate}</div>
            `;
            previewContent.appendChild(card);
        });

        previewArea.style.display = "block";

    } catch (err) {
        previewArea.style.display = "none";
        zoneTexte.classList.add('error-border');
        zoneErreur.style.display = 'block';
        zoneErreur.innerHTML = "<strong>⚠️ ERREUR :</strong> " + err.message;
    }
}
</script>

</body>
</html>
