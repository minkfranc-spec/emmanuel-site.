<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMMANUEL | La Lumière qui éclaire vos pas</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background: #fdfdfd; font-family: 'Lora', serif; text-align: center; overflow-x: hidden; }
        
        .gold-text { color: #d4af37; font-family: 'Montserrat'; font-weight: 900; }
        
        /* --- POINT 1: BOUTONS FR/EN PLUS PETITS --- */
        .lang-selector { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; z-index: 100; }
        .lang-btn { background: #f0f0f0; border: 1px solid #ddd; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-family: 'Montserrat'; font-weight: 900; font-size: 9px; color: #bbb; transition: 0.3s; }
        .lang-btn.active { background: #ff0000; color: white; border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.4); }

        /* --- LAMPE VIBRANTE --- */
        #sanctuary-light-wrapper { position: fixed; right: 20px; top: 20px; z-index: 5000; }
        #altar-lamp { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; animation: shiver 0.5s infinite alternate; }
        .flame-core { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #d4af37, 0 0 40px #ffcc00, 0 0 60px #d4af37; animation: flicker 1s infinite; z-index: 2; }
        @keyframes shiver { from { transform: translate(0,0); } to { transform: translate(1px, 1px); } }
        @keyframes flicker { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }

        #notif-panel { position: fixed; right: -320px; top: 0; height: 100vh; width: 280px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-left: 2px solid #d4af37; padding: 40px 25px; transition: 0.6s; z-index: 4999; text-align: left; }
        #notif-panel.active { right: 0; }
        .close-notif { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; font-weight: 900; }

        /* --- ARCHIVES --- */
        .archive-section { margin: 40px auto; width: 92%; max-width: 540px; }
        .archive-main-btn { background: #1a1a1a; color: white; padding: 12px 25px; border-radius: 50px; border: none; cursor: pointer; font-family: 'Montserrat'; font-weight: 700; text-transform: uppercase; font-size: 0.8em; margin-bottom: 20px; }
        #archive-box { display: none; background: white; padding: 20px; border-radius: 15px; border: 2px solid #d4af37; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1); }
        .months-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 20px; border: 1px solid #d4af37; padding: 8px; border-radius: 8px; }
        .month-btn { background: #f8f8f8; border: 1px solid #eee; padding: 8px 1px; border-radius: 5px; cursor: pointer; font-family: 'Montserrat'; font-size: 8px; font-weight: 700; color: #777; }
        .month-btn.active { background: #d4af37; color: white; border-color: #d4af37; }

        /* --- MESSAGES ANIMÉS --- */
        .message-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 92%; max-width: 540px; margin: 25px auto; text-align: left; border-top: 6px solid #d4af37; transition: transform 0.4s ease; }
        .message-card:hover { transform: translateY(-8px); }
        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 20px; }

        /* --- COMPTEUR BILINGUE --- */
        .flag-counter-box { background: white; padding: 30px 20px; border-radius: 20px; margin: 40px auto; width: 92%; max-width: 500px; border: 1px solid #f0f0f0; }
        .title-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-family: 'Montserrat'; font-weight: 700; animation: titleDance 4s infinite ease-in-out; }
        @keyframes titleDance { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
    </style>
</head>
<body>

    <audio id="bellSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <div class="lang-selector">
        <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <div id="sanctuary-light-wrapper">
        <div id="altar-lamp" onclick="toggleCommunion(true)">
            <div class="flame-core"></div>
            <span style="font-size: 20px; position: relative; z-index: 3;">🕯️</span>
        </div>
        <div id="notif-panel">
            <div class="close-notif" onclick="toggleCommunion(false)">×</div>
            <h3 class="gold-text" style="font-size:10px; letter-spacing:3px;">COMMUNION</h3>
            <p style="font-size:0.9em;" id="notif-txt">Adresse : <strong>emmanuel-dpv.pages.dev</strong></p>
        </div>
    </div>

    <h1 class="gold-text" style="font-size: 2.2em; margin-top: 70px; margin-bottom: 5px;">EMMANUEL</h1>
    <p id="slogan" style="font-family:'Montserrat'; letter-spacing:2px; color:#d4af37; font-weight: 700; font-size: 0.65em; text-transform: uppercase;">La Lumière qui éclaire vos pas</p>

    <div id="flux-messages"></div>

    <div class="archive-section">
        <button class="archive-main-btn" id="btn-archive-label" onclick="openArchiveBox()">📂 Archives</button>
        <div id="archive-box">
            <div class="months-grid" id="months-list">
                <button class="month-btn" id="m-01" onclick="selectMonth('01')">JAN</button>
                <button class="month-btn" id="m-02" onclick="selectMonth('02')">FEB</button>
                <button class="month-btn" id="m-03" onclick="selectMonth('03')">MAR</button>
                <button class="month-btn" id="m-04" onclick="selectMonth('04')">APR</button>
                <button class="month-btn" id="m-05" onclick="selectMonth('05')">MAY</button>
                <button class="month-btn" id="m-06" onclick="selectMonth('06')">JUN</button>
                <button class="month-btn" id="m-07" onclick="selectMonth('07')">JUL</button>
                <button class="month-btn" id="m-08" onclick="selectMonth('08')">AUG</button>
                <button class="month-btn" id="m-09" onclick="selectMonth('09')">SEP</button>
                <button class="month-btn" id="m-10" onclick="selectMonth('10')">OCT</button>
                <button class="month-btn" id="m-11" onclick="selectMonth('11')">NOV</button>
                <button class="month-btn" id="m-12" onclick="selectMonth('12')">DEC</button>
            </div>
            <div id="archive-view">
                <div id="titles-container" style="display:none;">
                    <ul style="list-style:none; padding:0;" id="list-titles"></ul>
                    <button id="back-btn-txt" style="background:#eee; border:none; padding:8px 20px; border-radius:20px; font-size:9px; cursor:pointer; font-weight:900;" onclick="showMonthsOnly()">⬅ RETOUR</button>
                </div>
                <div id="selected-msg-container"></div>
            </div>
        </div>
    </div>

    <div class="flag-counter-box">
        <div id="counter-title" style="font-family:'Montserrat'; font-weight:900; font-size:1.1em;">LECTEURS PAR PAYS</div>
        <a href="https://info.flagcounter.com/ivJp" target="_blank">
            <img src="https://s01.flagcounter.com/count2/ivJp/bg_FFFFFF/txt_000000/border_FFFFFF/columns_3/maxflags_12/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag" border="0" style="margin-top:15px; max-width:100%;">
        </a>
        <div id="refresh-txt" style="font-family:'Montserrat'; font-size:10px; color:#95a5a6; margin-top:15px; font-weight:700;">
            Le compteur s'actualise toutes les 15 min<br>
            <span style="font-weight:400; font-style:italic; opacity:0.6;">The counter updates every 15 min</span>
        </div>
    </div>

    <script>
        let currentLang = 'fr';
        let tousLesMessages = [];

        // POINT INTERFACE BILINGUE
        const translations = {
            fr: { slogan: "La Lumière qui éclaire vos pas", archive: "📂 Archives", counter: "LECTEURS PAR PAYS", back: "⬅ RETOUR", published: "Publié le" },
            en: { slogan: "The Light that guides your steps", archive: "📂 Archives", counter: "READERS BY COUNTRY", back: "⬅ BACK", published: "Published on" }
        };

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            // Mise à jour des textes
            document.getElementById('slogan').innerText = translations[lang].slogan;
            document.getElementById('btn-archive-label').innerText = translations[lang].archive;
            document.getElementById('counter-title').innerText = translations[lang].counter;
            document.getElementById('back-btn-txt').innerText = translations[lang].back;
            
            afficherFlux();
        }

        function toggleCommunion(s) { document.getElementById('notif-panel').classList.toggle('active', s); if(s) document.getElementById('bellSound').play(); }

        async function charger() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                const now = new Date();
                const heureCam = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 3600000);
                
                tousLesMessages = data.messages.filter(msg => {
                    const [a, m, j] = msg.date.split('-').map(Number);
                    return heureCam >= new Date(a, m - 1, j);
                });
                afficherFlux();
            } catch (e) { console.error(e); }
        }

        function afficherFlux() {
            const container = document.getElementById('flux-messages');
            // On filtre ici les messages selon la langue choisie
            const messagesFiltrés = tousLesMessages.filter(m => m.lang === currentLang || !m.lang);
            container.innerHTML = [...messagesFiltrés].sort((a,b) => b.id - a.id).slice(0, 3).map(msg => creerCard(msg)).join('');
        }

        function openArchiveBox() {
            const box = document.getElementById('archive-box');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
            if(box.style.display === 'block') showMonthsOnly();
        }

        function selectMonth(m) {
            document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('m-'+m).classList.add('active');
            const messagesMois = tousLesMessages.filter(msg => msg.date.split('-')[1] === m && (msg.lang === currentLang || !msg.lang)).sort((a,b) => a.id - b.id);
            const list = document.getElementById('list-titles');
            list.innerHTML = messagesMois.length ? messagesMois.map(msg => `<li class="title-item" onclick="voirMessage(${msg.id})">${msg.titre}</li>`).join('') : "<li>...</li>";
            document.getElementById('titles-container').style.display = 'block';
            document.getElementById('selected-msg-container').innerHTML = '';
            document.querySelector('.months-grid').style.display = 'none';
        }

        function showMonthsOnly() {
            document.getElementById('titles-container').style.display = 'none';
            document.getElementById('selected-msg-container').innerHTML = '';
            document.querySelector('.months-grid').style.display = 'grid';
        }

        function voirMessage(id) {
            const msg = tousLesMessages.find(m => m.id === id);
            document.getElementById('selected-msg-container').innerHTML = creerCard(msg) + `<button style="background:#f1f1f1; border:none; padding:10px 20px; border-radius:30px; font-family:'Montserrat'; font-size:9px; font-weight:900; cursor:pointer; margin-top:15px; color:#d4af37;" onclick="selectMonth('${msg.date.split('-')[1]}')">${translations[currentLang].back}</button>`;
            document.getElementById('titles-container').style.display = 'none';
        }

        function creerCard(msg) {
            return `<div class="message-card">
                ${msg.image ? `<img src="${msg.image}" class="msg-img">` : ''}
                <h3 class="gold-text" style="text-align:center; text-transform:uppercase; font-size:1.1em;">${msg.titre}</h3>
                ${msg.audio ? `<audio src="${msg.audio}" controls style="width:100%; margin:15px 0;"></audio>` : ''}
                <div style="text-align:justify; line-height:1.6; white-space:pre-line;">${msg.texte.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
                <p style="text-align:right; font-size:0.7em; color:#d4af37; font-weight:700;">${translations[currentLang].published} ${msg.date}</p>
            </div>`;
        }
        charger();
    </script>
</body>
</html>
