<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN MULTIMÉDIA | Emmanuel DPV</title>
    <style>
        :root { --gold: #d4af37; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; padding: 10px; text-align: center; }
        .admin-box { max-width: 900px; margin: auto; background: var(--card); padding: 25px; border-radius: 25px; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); margin-bottom: 40px; }
        h1 { color: var(--gold); font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px; }
        textarea { width: 100%; height: 250px; border-radius: 15px; border: 1px solid #444; padding: 15px; background: #000; color: #00ff00; font-family: 'Courier New', monospace; box-sizing: border-box; font-size: 14px; transition: 0.3s; resize: vertical; margin-bottom: 10px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { cursor: pointer; border: none; border-radius: 50px; font-weight: bold; transition: 0.3s; padding: 15px; text-transform: uppercase; font-size: 0.85em; }
        .btn-view { background: #2980b9; color: white; }
        .btn-fix { background: var(--gold); color: black; }
        .btn-copy { background: #fff; color: #000; width: 100%; margin-top: 10px; }
        .btn-clear { background: #c0392b; color: white; margin-top: 10px; font-size: 0.7em; padding: 8px; }
        #preview-container { max-width: 800px; margin: auto; text-align: left; padding: 20px; border-top: 2px dashed var(--gold); }
        .msg-card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 20px; margin-bottom: 25px; overflow: hidden; }
        .msg-header { color: var(--gold); font-weight: bold; font-size: 1.2em; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .msg-meta { font-size: 0.8em; color: #777; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .preview-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        audio { width: 100%; height: 35px; margin: 10px 0; border-radius: 5px; filter: invert(1); }
        .msg-text { line-height: 1.7; white-space: pre-wrap; color: #ddd; font-size: 0.95em; }
        .highlight-text { color: var(--gold); font-weight: bold; }
        
        /* MODIFICATION : Taille de police augmentée pour le communiqué */
        .comm-banner { 
            background: rgba(212, 175, 55, 0.1); 
            border: 1px solid var(--gold); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            color: var(--gold); 
            font-weight: bold; 
            font-size: 1.15em; /* Augmentation de la lisibilité */
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .comm-count {
            background: var(--gold);
            color: black;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7em;
            margin-left: 10px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="admin-box">
    <h1>🏛️ COMMANDE MULTIMÉDIA v2.2</h1>
    <div style="text-align: left;">
        <label style="color: var(--gold); font-weight: bold; margin-left: 10px;">📥 COLLEZ (COMPLET OU MORCEAU) :</label>
        <textarea id="inputJSON" placeholder="Collez votre code ici..."></textarea>
        <div class="btn-group">
            <button class="btn btn-view" onclick="traiter(false)">👁️ VISIONNER & SAUVER</button>
            <button class="btn btn-fix" onclick="traiter(true)">⚖️ RÉORDONNER & RÉPARER</button>
        </div>
    </div>
    <div style="text-align: left;">
        <label style="color: var(--gold); font-weight: bold; margin-left: 10px;">📤 SORTIE PROPRE :</label>
        <textarea id="outputJSON" readonly></textarea>
        <button class="btn btn-copy" onclick="copier()">⚡ COPIER LE RÉSULTAT</button>
        <button class="btn btn-clear" onclick="viderMemoire()">🗑️ VIDER LA MÉMOIRE</button>
    </div>
</div>

<h2 style="color: var(--gold);">👁️ APERÇU GÉNÉRAL</h2>
<div id="preview-container"></div>

<script>
    window.onload = function() {
        let savedData = localStorage.getItem('emmanuel_backup');
        if (savedData) {
            document.getElementById('inputJSON').value = savedData;
            traiter(false);
        }
    };

    function traiter(doitReorganiser) {
        let raw = document.getElementById('inputJSON').value.trim();
        if (!raw) return;
        
        try {
            if (raw.startsWith('{') && !raw.includes('"messages"')) {
                raw = '{ "status": "online", "messages": [' + raw + '] }';
            }
            else if (raw.startsWith('[')) {
                raw = '{ "status": "online", "messages": ' + raw + ' }';
            }

            let clean = raw.replace(/,\s*}/g, "}").replace(/,\s*]/g, "]");
            let parsed = JSON.parse(clean);
            
            let commVal = parsed.communique || parsed.communiques || null;
            let commKey = parsed.communique ? "communique" : "communiques";
            let msgs = parsed.messages || (Array.isArray(parsed) ? parsed : [parsed]);

            if (doitReorganiser && msgs.length > 0) {
                let lastIndex = msgs.length - 1;
                let currentId = parseInt(msgs[lastIndex].id) || 1;
                let currentDate = new Date(msgs[lastIndex].date);
                if (isNaN(currentDate)) currentDate = new Date();

                for (let i = lastIndex - 1; i >= 0; i--) {
                    currentId++;
                    currentDate.setDate(currentDate.getDate() + 1);
                    msgs[i].id = currentId;
                    msgs[i].date = currentDate.toISOString().split('T')[0];
                }
            }
            
            let finalData = { status: parsed.status || "online" };
            if (commVal) finalData[commKey] = commVal;
            finalData.messages = msgs;

            let finalString = JSON.stringify(finalData, null, 2);
            document.getElementById('outputJSON').value = finalString;
            localStorage.setItem('emmanuel_backup', finalString);
            
            renderPreview(msgs, commVal);
        } catch (e) { 
            alert("❌ ERREUR STRUCTURE : Vérifiez les virgules entre les messages."); 
        }
    }

    function renderPreview(msgs, comm) {
        const container = document.getElementById('preview-container');
        container.innerHTML = ""; 
        
        if (comm && comm.trim() !== "") {
            // SCRIPT DE COMPTAGE DES PARAGRAPHES
            let paragraphes = comm.split(/\n\s*\n/).filter(p => p.trim() !== "");
            let nbPara = paragraphes.length;
            
            let div = document.createElement('div');
            div.className = "comm-banner";
            div.innerHTML = `📢 COMMUNIQUÉ <span class="comm-count">${nbPara} message(s)</span><br><br>${comm}`;
            container.appendChild(div);
        }

        msgs.forEach(m => {
            let card = document.createElement('div');
            card.className = "msg-card";
            let imgHtml = m.image ? `<img src="${m.image}" class="preview-img">` : '';
            let audioHtml = m.audio ? `<audio controls src="${m.audio}"></audio>` : '';
            let textePreview = (m.texte || "").replace(/\*\*(.*?)\*\*/g, '<span class="highlight-text">$1</span>');
            
            card.innerHTML = `
                ${imgHtml}
                <div class="msg-header"><span>${m.titre}</span><span style="font-size:0.7em; opacity:0.5;">ID: ${m.id}</span></div>
                <div class="msg-meta">📅 ${m.date} | 🏷️ ${m.categorie}</div>
                ${audioHtml}
                <div class="msg-text">${textePreview}</div>
            `;
            container.appendChild(card);
        });
    }

    function copier() {
        document.getElementById('outputJSON').select();
        document.execCommand('copy');
        alert("🎯 CODE PROPRE COPIÉ !");
    }

    function viderMemoire() {
        if(confirm("Effacer l'historique de prévisualisation ?")) {
            localStorage.removeItem('emmanuel_backup');
            location.reload();
        }
    }
</script>
</body>
</html>
