<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script>
      (function() {
        var currentHost = window.location.hostname;
        var targetHost = "emmanuel-dpv.pages.dev";
        if (currentHost.includes("vercel.app")) {
          window.location.replace("https://" + targetHost + window.location.pathname + window.location.search);
        }
      })();
    </script>

    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="description" content="EMMANUEL - Un sanctuaire numérique pour la transformation de l'âme, l'onction de prospérité et la liberté spirituelle par la Parole.">
    <meta name="keywords" content="Pasteur Emmanuel, foi, onction, prospérité, bible, pardon, succès, sagesse divine, ministère">
    <meta name="author" content="Pasteur Emmanuel">

    <meta property="og:title" content="EMMANUEL | La Lumière qui éclaire vos pas">
    <meta property="og:description" content="Accédez à vos clés spirituelles pour une vie de victoire.">
    <meta property="og:image" content="https://i.postimg.cc/cCXq2khG/Lancement.png">
    <meta property="og:url" content="https://emmanuel-dpv.pages.dev">
    <meta property="og:type" content="website">
    
    <title>EMMANUEL | La Lumière qui éclaire vos pas</title>

    <link rel="canonical" href="https://emmanuel-dpv.pages.dev">
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        /* DESIGN PASTEUR EMMANUEL - ANIMÉ & HARMONISÉ */
        * { box-sizing: border-box; scroll-behavior: smooth; }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            background: #fdfdfd; 
            color: #1a1a1a; 
            font-family: 'Lora', serif; 
            text-align: center; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 5000; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s ease; }
        .welcome-text { font-family: 'Montserrat', sans-serif; font-size: 1.4em; font-weight: 900; color: #d4af37; letter-spacing: 5px; text-transform: uppercase; border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37; padding: 15px 30px; animation: welcomeEntry 1.5s forwards; opacity: 0; }

        @keyframes welcomeEntry { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes blockDance { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes flicker { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1); } }
        @keyframes shiver { from { transform: translate(0,0); } to { transform: translate(1px, 1px); } }

        /* --- VEILLEUSE ROUGE SUR BOUTONS --- */
        .lang-selector { margin: 25px 0 15px; display: inline-flex; background: #eee; padding: 4px; border-radius: 10px; gap: 5px; }
        .lang-btn { font-family: 'Montserrat', sans-serif; font-weight: 900; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; transition: 0.4s; background: transparent; color: #999; font-size: 10px; }
        .lang-btn.active { 
            background: #ff0000; 
            color: white; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); /* Effet Veilleuse */
        }

        /* --- BOUGIE DE NOTIFICATION --- */
        #notification-candle { 
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%); 
            z-index: 4000; cursor: pointer; animation: shiver 0.2s infinite alternate;
        }
        .flame { 
            width: 12px; height: 12px; background: #fff; border-radius: 50%; 
            margin: 0 auto; box-shadow: 0 0 15px #d4af37, 0 0 25px #ffcc00; 
            animation: flicker 0.8s infinite;
        }
        .candle-body { width: 18px; height: 25px; background: #eee; border-radius: 3px; margin-top: -2px; border-bottom: 3px solid #d4af37; }

        h1 { font-family: 'Montserrat', sans-serif; color: #1a1a1a; text-transform: uppercase; font-weight: 900; font-size: 2.2em; margin: 15px 0 5px 0; letter-spacing: -1px; animation: blockDance 1s ease; }
        .intro-text { width: 85%; margin: 0 auto 15px auto; font-size: 0.9em; color: #d4af37; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }

        .search-container { position: relative; width: 85%; max-width: 400px; margin: 0 auto 25px; animation: blockDance 1.2s ease; }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 50px; border: 1px solid #eee; outline: none; transition: 0.3s; font-family: 'Montserrat'; font-size: 0.8em; }
        .search-input:focus { border-color: #d4af37; box-shadow: 0 5px 15px rgba(212,175,55,0.1); }

        .message-card { 
            background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
            width: 92%; max-width: 540px; margin: 25px auto; text-align: left; border-top: 6px solid #d4af37; 
            animation: blockDance 0.8s ease-out forwards; transition: transform 0.3s ease;
        }
        .message-card:hover { transform: translateY(-10px); }
        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 20px; transition: 0.5s; }
        .message-card:hover .msg-img { filter: brightness(1.1); }
        
        .msg-title { font-family: 'Montserrat', sans-serif; text-align: center; margin: 10px 0 15px 0; color: #1a1a1a; font-size: 1.2em; font-weight: 900; text-transform: uppercase; }
        .msg-content { text-align: justify; line-height: 1.7; font-size: 1.05em; white-space: pre-line; color: #1a1a1a; }
        .msg-content strong { font-family: 'Montserrat', sans-serif; font-weight: 900; color: #d4af37; }
        
        .copy-btn { font-family: 'Montserrat', sans-serif; background: #1a1a1a; color: white; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; font-weight: 700; text-transform: uppercase; margin: 20px 0; border: none; transition: 0.3s; }
        .copy-btn:hover { background: #d4af37; transform: scale(1.02); }

        .archive-main-btn { font-family: 'Montserrat', sans-serif; background: #f1f1f1; color: #1a1a1a; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 900; display: block; margin: 30px auto; text-transform: uppercase; font-size: 0.8em; }
        
        .floating-container { position: fixed; right: 20px; z-index: 1500; display: none; align-items: center; text-decoration: none; }
        .scroll-link { bottom: 105px; }
        .scroll-btn { background: #d4af37; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 20px; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }

        .flag-counter-box { background: white; padding: 30px 20px; border-radius: 20px; margin: 40px auto; width: 92%; max-width: 500px; border: 1px solid #f0f0f0; }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="welcome-text" id="welcome-txt">Bienvenue à EMMANUEL</div></div>

    <div id="notification-candle" onclick="window.location.href='https://emmanuel-dpv.pages.dev'">
        <div class="flame"></div>
        <div class="candle-body"></div>
    </div>

    <a href="javascript:void(0)" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="floating-container scroll-link" id="scrollTopLink">
        <button class="scroll-btn">↑</button>
    </a>
    
    <div class="lang-selector">
        <button id="btn-fr" class="lang-btn active" onclick="setLanguage('fr')">FR</button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <h1>EMMANUEL</h1>
    <div class="intro-text" id="intro-txt">La Lumière qui éclaire vos pas</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un message..." onkeyup="filtrerMessages()">
    </div>

    <div id="flux-messages"></div>

    <button class="archive-main-btn" id="btn-archive" onclick="toggleArchives()">📂 Consulter les Archives</button>
    
    <div id="archiveSection" style="display:none; width: 92%; max-width: 500px; margin: 0 auto 40px;">
        <div id="monthGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
        <div id="titres-liste"></div> 
        <div id="message-detail"></div> 
    </div>

    <div class="flag-counter-box">
        <div style="font-family:'Montserrat'; font-weight:900;" id="stat-title">LECTEURS PAR PAYS</div>
        <a href="https://info.flagcounter.com/ivJp" target="_blank">
            <img src="https://s01.flagcounter.com/count2/ivJp/bg_FFFFFF/txt_000000/border_FFFFFF/columns_3/maxflags_12/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Statistiques" border="0" style="margin-top:20px; max-width: 100%;">
        </a>
    </div>

    <div id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:5000;" onclick="fermerPartage()"></div>
    <div id="shareModal" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:white; z-index:5001; padding:30px; border-radius:25px 25px 0 0; text-align:center;">
        <h3 style="font-family:'Montserrat'; color:#d4af37;">PARTAGER LA PAROLE</h3>
        <div style="display:flex; justify-content:space-around; margin:20px 0;">
            <div onclick="actionPartage('wa')">🟢<br>WhatsApp</div>
            <div onclick="actionPartage('copy')">🔗<br>Copier</div>
        </div>
        <button onclick="fermerPartage()" style="background:none; border:none; font-weight:900; color:#999; margin-top:10px;">FERMER</button>
    </div>

    <script>
        let currentLang = 'fr';
        let tousLesMessages = [];
        let msgPartageTemp = "";
        let titrePartageTemp = "";

        const translations = { 
            fr: { welcome: "Bienvenue à EMMANUEL", intro: "La Lumière qui éclaire vos pas", search: "Rechercher...", share: "Partager", copied: "Lien copié !", stat: "LECTEURS PAR PAYS" },
            en: { welcome: "Welcome to EMMANUEL", intro: "The Light that guides your steps", search: "Search...", share: "Share", copied: "Link copied!", stat: "READERS BY COUNTRY" }
        };

        async function chargerMessages() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                tousLesMessages = data.messages || [];
                afficherAccueil();
                genererBoutonsMois();
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 800);
            } catch (err) { console.error(err); }
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('intro-txt').innerText = translations[lang].intro;
            document.getElementById('stat-title').innerText = translations[lang].stat;
            document.getElementById('searchInput').placeholder = translations[lang].search;
            afficherAccueil();
        }

        function afficherAccueil() {
            const container = document.getElementById('flux-messages');
            const derniers = [...tousLesMessages].sort((a, b) => b.id - a.id).slice(0, 3);
            container.innerHTML = derniers.map(msg => creerCard(msg)).join('');
        }

        function creerCard(msg) {
            const texte = (currentLang === 'en' && msg.texte_en) ? msg.texte_en : msg.texte;
            const titre = (currentLang === 'en' && msg.titre_en) ? msg.titre_en : msg.titre;
            return `<div class="message-card">
                ${msg.image ? `<img src="${msg.image}" class="msg-img">` : ''}
                <h3 class="msg-title">${titre}</h3>
                <div class="msg-content">${texte.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
                <button class="copy-btn" onclick="ouvrirMenuPartage('${btoa(unescape(encodeURIComponent(titre)))}', '${btoa(unescape(encodeURIComponent(texte)))}')">${translations[currentLang].share}</button>
            </div>`;
        }

        function toggleArchives() {
            const s = document.getElementById('archiveSection');
            s.style.display = (s.style.display === 'none') ? 'block' : 'none';
        }

        function genererBoutonsMois() {
            const grid = document.getElementById('monthGrid');
            const mois = ["JAN", "FEV", "MAR", "AVR", "MAI", "JUN", "JUL", "AOU", "SEP", "OCT", "NOV", "DEC"];
            grid.innerHTML = mois.map((m, i) => `<button style="padding:10px; border:1px solid #eee; background:white; border-radius:5px; font-weight:900; font-size:10px;" onclick="afficherTitresMois(${i+1})">${m}</button>`).join('');
        }

        function ouvrirMenuPartage(ti, te) {
            titrePartageTemp = decodeURIComponent(escape(atob(ti)));
            msgPartageTemp = decodeURIComponent(escape(atob(te))).replace(/\*\*/g, '');
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('shareModal').style.display = 'block';
        }

        function fermerPartage() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('shareModal').style.display = 'none';
        }

        function actionPartage(type) {
            const text = titrePartageTemp + "\n\n" + msgPartageTemp + "\n\nhttps://emmanuel-dpv.pages.dev";
            if (type === 'wa') window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text));
            if (type === 'copy') { navigator.clipboard.writeText(text); alert(translations[currentLang].copied); }
            fermerPartage();
        }

        window.onscroll = function() {
            document.getElementById("scrollTopLink").style.display = (window.scrollY > 400) ? "flex" : "none";
        };

        chargerMessages();
    </script>
</body>
</html>
