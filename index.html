<head>

        if (currentHost.includes("vercel.app")) {
          window.location.replace("https://" + targetHost + window.location.pathname + window.location.search);

    <meta name="robots" content="index, follow">

    <title>EMMANUEL | La Voix de la Vérité</title>

    <link rel="canonical" href="https://emmanuel-dpv.pages.dev">
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        /* STYLE ORIGINAL PRÉSERVÉ */
        * { box-sizing: border-box; scroll-behavior: smooth; }
        html, body { margin: 0; padding: 0; width: 100%; background: #fdfdfd; color: #1a1a1a; font-family: 'Lora', serif; text-align: center; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease-in-out; }
        .welcome-text { font-family: 'Montserrat', sans-serif; font-size: 1.6em; font-weight: 700; color: #d4af37; letter-spacing: 6px; text-transform: uppercase; border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37; padding: 20px 40px; animation: welcomeEntry 2s forwards; opacity: 0; }
        @keyframes welcomeEntry { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes blockDance { 0% { opacity: 0; transform: scale(0.95) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulseGold { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        /* BOUTON STOP STYLE */
        .stop-btn { position: fixed; top: 20px; left: 20px; z-index: 3000; display: none; background: #e74c3c; color: white; border: 2px solid white; border-radius: 50px; padding: 10px 20px; font-family: 'Montserrat'; font-weight: 900; font-size: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: pulseGold 2s infinite; }

        .lang-selector { margin: 15px 0 15px; display: inline-flex; background: #f1f1f1; padding: 4px; border-radius: 30px; border: 1px solid #eee; }
        .lang-btn { font-family: 'Montserrat', sans-serif; font-weight: 700; padding: 8px 18px; border-radius: 25px; border: none; cursor: pointer; transition: all 0.4s ease; background: transparent; color: #95a5a6; font-size: 10px; letter-spacing: 1px; }
        .lang-btn.active { background: #fff; color: #e74c3c; border: 1px solid #d4af37; box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.6), 0 0 10px rgba(212, 175, 55, 0.3); text-shadow: 0 0 2px rgba(212, 175, 55, 0.2); }

        h1 { font-family: 'Montserrat', sans-serif; color: #1a1a1a; text-transform: uppercase; font-weight: 900; font-size: 1.8em; margin: 15px 0 5px 0; }
        .intro-text { width: 85%; margin: 0 auto 10px auto; font-size: 1.1em; color: #95a5a6; font-style: italic; }

        .search-container { position: relative; width: 85%; max-width: 400px; margin: 0 auto 25px; }
        .search-input { width: 100%; padding: 12px 40px 12px 20px; border-radius: 30px; border: 1px solid #eee; font-family: 'Montserrat', sans-serif; font-size: 0.85em; transition: 0.3s; outline: none; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #d4af37; font-size: 1.1em; pointer-events: none; }

        .message-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 92%; max-width: 540px; margin: 25px auto; text-align: left; border-top: 6px solid #d4af37; animation: blockDance 0.8s ease-out forwards; }
        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 20px; display: block; }
        .msg-title { font-family: 'Montserrat', sans-serif; text-align: center; margin: 10px 0 15px 0; color: #1a1a1a; font-size: 1.15em; font-weight: 900; line-height: 1.3; text-transform: uppercase; }
        .msg-content { text-align: justify; line-height: 1.6; font-size: 1.05em; white-space: pre-line; color: #1a1a1a; font-weight: 400; } 
        .msg-content strong { font-family: 'Montserrat', sans-serif; font-weight: 900; color: #000000; }
        .copy-btn { font-family: 'Montserrat', sans-serif; background: transparent; border: 2px solid #d4af37; color: #d4af37; padding: 14px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 700; text-transform: uppercase; margin: 20px 0; transition: 0.3s; animation: pulseGold 2s infinite; }
        .published-date { display: block; text-align: right; color: #d4af37; font-size: 0.85em; font-weight: 700; font-style: italic; margin-top: 10px; }

        .archive-section { display: none; width: 92%; max-width: 500px; margin: 20px auto; padding-bottom: 40px; }
        .archive-main-btn { font-family: 'Montserrat', sans-serif; background: #1a1a1a; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; display: block; margin: 20px auto; text-transform: uppercase; max-width: 280px; }
        .floating-container { position: fixed; right: 20px; z-index: 1500; display: none; align-items: center; text-decoration: none; }
        .scroll-link { bottom: 105px; }
        .whatsapp-link { bottom: 30px; display: flex !important; }
        .scroll-btn { background: #1a1a1a; color: white; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body onclick="demarrerAmbiance()">

    <button id="stopButton" class="stop-btn" onclick="stopSearch()">🛑 STOP</button>

    <audio id="bg-music" loop><source src="adoration1.mp3" type="audio/mpeg"></audio>

    <div id="loading-screen">
        <div class="welcome-text" id="welcome-txt">Bienvenue à EMMANUEL</div>
    </div>

    <a href="javascript:void(0)" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="floating-container scroll-link" id="scrollTopLink">
        <button class="scroll-btn">↑</button>
    </a>
    
    <a href="https://wa.me/237678356844" target="_blank" class="floating-container whatsapp-link">
        <div class="whatsapp-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="60"></div>
    </a>

    <div class="lang-selector">
        <button id="btn-fr" class="lang-btn active" onclick="setLanguage('fr')">FR</button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <h1>EMMANUEL</h1>
    <div class="intro-text" id="intro-txt">La Lumière qui éclaire chaque pas sur le chemin de la Vie.</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un message..." onkeyup="filtrerMessages()">
        <span class="search-icon">🔍</span>
    </div>

    <div id="flux-messages"></div>

    <button class="archive-main-btn" id="btn-archive" onclick="toggleArchives()">📂 Consulter les Archives</button>
    
    <div id="archiveSection" class="archive-section">
        <div id="titres-liste"></div> 
        <div id="message-detail"></div> 
    </div>

    <script>
        let currentLang = 'fr';
        let tousLesMessages = [];
        let messagesAffiches = 3;
        let isSearching = false;
        let musicStarted = false;

        const translations = {
            fr: { welcome: "Bienvenue à EMMANUEL", intro: "La Lumière qui éclaire chaque pas sur le chemin de la Vie.", searchPlaceholder: "Rechercher un message...", archiveBtn: "📂 Consulter les Archives", published: "Publié le", shareBtn: "📤 Partager" },
            en: { welcome: "Welcome to EMMANUEL", intro: "The Light that guides every step on the path of Life.", searchPlaceholder: "Search for a message...", archiveBtn: "📂 View Archives", published: "Published on", shareBtn: "📤 Share" }
        };

        async function chargerMessages() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                tousLesMessages = data.messages || [];
                
                afficherAccueil();

                // DÉBLOQUAGE DE L'ÉCRAN :
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 500);

            } catch (err) {
                console.error("Erreur de chargement", err);
                document.getElementById('loading-screen').style.display = 'none';
            }
        }

        function demarrerAmbiance() {
            if (!musicStarted) {
                const audio = document.getElementById('bg-music');
                audio.volume = 0.1; audio.play(); musicStarted = true;
            }
        }

        function creerCard(msg) {
            const dateObj = new Date(msg.date);
            const dateAffichee = currentLang === 'fr' ? dateObj.toLocaleDateString('fr-FR') : dateObj.toLocaleDateString('en-US');
            const texte = (currentLang === 'en' && msg.texte_en) ? msg.texte_en : msg.texte;
            const titre = (currentLang === 'en' && msg.titre_en) ? msg.titre_en : msg.titre;
            
            let imgHtml = msg.image ? `<img src="${msg.image}" class="msg-img">` : '';
            let audioHtml = msg.audio ? `<audio src="${msg.audio}" controls style="width: 100%; margin: 15px 0;"></audio>` : '';
            
            return `<div class="message-card">
                ${imgHtml}
                <h3 class="msg-title">${titre}</h3>
                ${audioHtml}
                <div class="msg-content">${texte.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
                <span class="published-date">${translations[currentLang].published} ${dateAffichee}</span>
            </div>`;
        }

        function afficherAccueil() {
            const container = document.getElementById('flux-messages');
            const trie = [...tousLesMessages].sort((a, b) => b.id - a.id);
            container.innerHTML = trie.slice(0, messagesAffiches).map(msg => creerCard(msg)).join('');
        }

        function filtrerMessages() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('flux-messages');
            const stopBtn = document.getElementById('stopButton');

            if (query === "") {
                stopSearch();
                return;
            }

            isSearching = true;
            stopBtn.style.display = 'block';
            const resultats = tousLesMessages.filter(msg => (msg.titre + msg.texte).toLowerCase().includes(query));
            container.innerHTML = resultats.sort((a,b) => b.id - a.id).map(msg => creerCard(msg)).join('');
        }

        function stopSearch() {
            isSearching = false;
            document.getElementById('searchInput').value = "";
            document.getElementById('stopButton').style.display = 'none';
            afficherAccueil();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        window.onscroll = function() {
            let btn = document.getElementById("scrollTopLink");
            if (window.scrollY > 400) btn.style.display = "flex"; else btn.style.display = "none";
        };

        chargerMessages();
    </script>
</body>
</html>
