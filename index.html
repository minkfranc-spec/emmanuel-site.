<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🕯️ Admin Emmanuel</title>
<style>
  :root {
    --gold: #d4af37;
    --bg: #121212;
    --card: #1e1e1e;
    --text: #f4f4f4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    border: 1px solid var(--gold);
    border-radius: 15px;
    background: var(--card);
    box-shadow: 0 10px 30px #0004;
  }

  h1, h2 {
    color: var(--gold);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 20px 0;
  }

  .section {
    background: rgba(255, 255, 255, .05);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    border-left: 4px solid var(--gold);
  }

  textarea {
    width: 100%;
    min-height: 150px;
    background: #000;
    color: #0f0;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    font: 14px/1.4 'Courier New', monospace;
    resize: vertical;
    margin: 10px 0;
  }

  .btn-group {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 15px 0;
  }

  button {
    padding: 12px 24px;
    border: 0;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    text-transform: uppercase;
    transition: .3s;
  }

  .btn-primary { background: var(--gold); color: #000; }
  .btn-primary:hover { transform: scale(1.05); background: #f0c742; }
  .btn-danger { background: #e74c3c; color: #fff; }

  .preview-wrapper {
    background: #fff;
    color: #333;
    padding: 30px;
    border-radius: 15px;
    margin: 20px 0;
  }

  .communique-box {
    background: #fff9e6;
    border: 2px dashed var(--gold);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    text-align: center;
    line-height: 1.8;
  }

  .message-card {
    border: 1px solid #eee;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 12px #0001;
    max-width: 700px;
    margin: 20px auto;
  }

  .message-date { color: var(--gold); font-weight: 700; font-size: .85em; text-align: right; }
  .message-title { margin: 10px 0; font-size: 1.4em; text-align: center; color: #111; }
  .message-category { font-style: italic; color: #888; font-size: .75em; text-align: center; margin-bottom: 15px; text-transform: uppercase; }
  .message-image { width: 100%; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 4px 8px #0002; }
  audio { width: 100%; height: 40px; }
  .message-text { white-space: pre-wrap; margin-top: 20px; line-height: 1.8; font-size: 1.05em; color: #222; }
</style>
</head>
<body>
<div class="container">
  <h1>🕯️ Administration Emmanuel</h1>

  <div class="section">
    <h2>📢 Nouveau Communiqué</h2>
    <textarea id="communiqueInput" placeholder="Tapez votre texte... **gras**"></textarea>
    <div class="btn-group">
      <button class="btn-primary" onclick="convertCommunique()">✨ Convertir</button>
    </div>
  </div>

  <div class="section">
    <h2>📦 JSON Messages</h2>
    <textarea id="jsonInput" placeholder="JSON ici..."></textarea>
    <div class="btn-group">
      <button class="btn-primary" onclick="processJSON()">🛠️ Traiter</button>
      <button class="btn-danger" onclick="clearCache()">🗑️ Vider</button>
    </div>
  </div>

  <h2>📄 JSON Final</h2>
  <textarea id="jsonOutput" readonly></textarea>

  <h2>📱 Aperçu</h2>
  <div id="preview" class="preview-wrapper">Aperçu ici...</div>
</div>

<script>
  let communiqueHTML = '';

  window.onload = () => {
    const cached = localStorage.getItem('emmanuel_cache');
    if (cached) {
      document.getElementById('jsonInput').value = cached;
      processJSON();
    }
  };

  function clearCache() {
    if (confirm('Tout effacer ?')) {
      localStorage.removeItem('emmanuel_cache');
      location.reload();
    }
  }

  function convertCommunique() {
    const raw = document.getElementById('communiqueInput').value;
    communiqueHTML = raw
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/\\n/g, '<br>');
    processJSON();
    alert('✓ Converti !');
  }

  function processJSON() {
    try {
      const raw = document.getElementById('jsonInput').value.trim().replace(/,\s*([}\]])/g, '$1');
      const parsed = raw[0] === '[' ? JSON.parse(raw) : JSON.parse(raw);
      const messages = raw[0] === '[' ? parsed : (parsed.messages || []);

      if (!communiqueHTML && parsed.communique) {
        communiqueHTML = parsed.communique;
      }

      // Recalcule les IDs et dates à partir du dernier message
      const last = messages[messages.length - 1];
      let currentId = parseInt(last.id);
      let currentDate = new Date(last.date);

      for (let i = messages.length - 1; i >= 0; i--) {
        messages[i].id = currentId;
        messages[i].date = currentDate.toISOString().split('T')[0];
        currentId++;
        currentDate.setDate(currentDate.getDate() + 1);
      }

      messages.sort((a, b) => b.id - a.id);

      const finalData = { status: 'online', communique: communiqueHTML, messages };
      document.getElementById('jsonOutput').value = JSON.stringify(finalData, null, 2);
      localStorage.setItem('emmanuel_cache', document.getElementById('jsonInput').value);

      renderPreview(messages);
    } catch (e) {
      alert('❌ JSON invalide');
    }
  }

  function renderPreview(messages) {
    let html = communiqueHTML ? `<div class="communique-box">${communiqueHTML}</div>` : '';

    messages.forEach(msg => {
      const boldText = msg.texte.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      html += `
        <div class="message-card">
          <div class="message-date">📅 ${msg.date} | ID: ${msg.id}</div>
          <div class="message-title"><b>${msg.titre}</b></div>
          <div class="message-category">${msg.categorie}</div>
          <div>
            ${msg.image ? `<img src="${msg.image}" class="message-image" onerror="this.style.display='none'">` : ''}
            ${msg.audio ? `<audio controls style="margin-bottom:5px;"><source src="${msg.audio}"></audio>` : ''}
            ${msg.audio2 ? `<audio controls><source src="${msg.audio2}"></audio>` : ''}
          </div>
          <div class="message-text">${boldText}</div>
        </div>`;
    });

    document.getElementById('preview').innerHTML = html;
  }
</script>
</body>
</html>
