<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script>
      (function() {
        var currentHost = window.location.hostname;
        var targetHost = "emmanuel-dpv.pages.dev";
        if (currentHost.includes("vercel.app")) {
          window.location.replace("https://" + targetHost + window.location.pathname + window.location.search);
        }
      })();
    </script>

    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="description" content="EMMANUEL - Un sanctuaire numérique pour la transformation de l'âme, l'onction de prospérité et la liberté spirituelle par la Parole.">
    <meta name="keywords" content="Pasteur Emmanuel, foi, onction, prospérité, bible, pardon, succès, sagesse divine, ministère">
    <meta name="author" content="Pasteur Emmanuel">

    <meta property="og:title" content="EMMANUEL | La Voix de la Vérité">
    <meta property="og:description" content="Accédez à vos clés spirituelles pour une vie de victoire.">
    <meta property="og:image" content="https://i.postimg.cc/cCXq2khG/Lancement.png">
    <meta property="og:url" content="https://emmanuel-dpv.pages.dev">
    <meta property="og:type" content="website">
    
    <title>EMMANUEL | La Voix de la Vérité</title>

    <link rel="canonical" href="https://emmanuel-dpv.pages.dev">
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        /* DESIGN PASTEUR EMMANUEL */
        * { box-sizing: border-box; scroll-behavior: smooth; }
        html, body { 
            margin: 0; padding: 0; 
            width: 100%; 
            background: #fdfdfd; 
            color: #1a1a1a; 
            font-family: 'Lora', serif; 
            text-align: center; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease-in-out; }
        .welcome-text { font-family: 'Montserrat', sans-serif; font-size: 1.6em; font-weight: 700; color: #d4af37; letter-spacing: 6px; text-transform: uppercase; border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37; padding: 20px 40px; animation: welcomeEntry 2s forwards; opacity: 0; }

        @keyframes welcomeEntry { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes blockDance { 0% { opacity: 0; transform: scale(0.95) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        
        .lang-selector { margin: 15px 0 15px; display: inline-flex; background: #f1f1f1; padding: 4px; border-radius: 30px; border: 1px solid #eee; }
        .lang-btn { font-family: 'Montserrat', sans-serif; font-weight: 700; padding: 8px 18px; border-radius: 25px; border: none; cursor: pointer; transition: all 0.4s ease; background: transparent; color: #95a5a6; font-size: 10px; letter-spacing: 1px; }
        .lang-btn.active { background: #fff; color: #e74c3c; border: 1px solid #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }

        h1 { font-family: 'Montserrat', sans-serif; color: #1a1a1a; text-transform: uppercase; font-weight: 900; font-size: 1.8em; margin: 15px 0 5px 0; }
        .intro-text { width: 85%; margin: 0 auto 10px auto; font-size: 1.1em; color: #95a5a6; font-style: italic; }

        .search-container { position: relative; width: 85%; max-width: 400px; margin: 0 auto 25px; }
        .search-input { width: 100%; padding: 12px 40px 12px 20px; border-radius: 30px; border: 1px solid #eee; font-family: 'Montserrat', sans-serif; font-size: 0.85em; transition: 0.3s; outline: none; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #d4af37; font-size: 1.1em; }

        .message-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 92%; max-width: 540px; margin: 25px auto; text-align: left; border-top: 6px solid #d4af37; animation: blockDance 0.8s ease-out forwards; }
        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 20px; display: block; }
        .msg-title { font-family: 'Montserrat', sans-serif; text-align: center; margin: 10px 0 15px 0; color: #1a1a1a; font-size: 1.15em; font-weight: 900; text-transform: uppercase; }
        .msg-content { text-align: justify; line-height: 1.6; font-size: 1.05em; white-space: pre-line; color: #1a1a1a; } 
        .msg-content strong { font-family: 'Montserrat', sans-serif; font-weight: 900; color: #000; }
        
        .copy-btn { font-family: 'Montserrat', sans-serif; background: transparent; border: 2px solid #d4af37; color: #d4af37; padding: 14px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 700; text-transform: uppercase; margin: 20px 0; }
        .published-date { display: block; text-align: right; color: #d4af37; font-size: 0.85em; font-weight: 700; font-style: italic; }

        /* ARCHIVES */
        .archive-section { display: none; width: 92%; max-width: 500px; margin: 20px auto; padding-bottom: 40px; }
        .archive-nav-btns { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .nav-btn { font-family: 'Montserrat', sans-serif; background: white; border: 2px solid #d4af37; color: #d4af37; padding: 10px 15px; border-radius: 30px; cursor: pointer; font-weight: 900; font-size: 11px; text-transform: uppercase; }
        .nav-btn.active { background: #d4af37; color: white; }
        .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .month-btn { font-family: 'Montserrat', sans-serif; background: white; border: 1px solid #d4af37; color: #d4af37; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 700; }
        .month-btn.active { background: #d4af37; color: white; }
        .titre-archive-item { background: #fff; border: 1px solid #eee; padding: 15px; margin: 8px 0; border-radius: 10px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 0.85em; font-weight: 700; text-align: left; }
        .archive-main-btn { font-family: 'Montserrat', sans-serif; background: #1a1a1a; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; display: block; margin: 20px auto; text-transform: uppercase; }
        
        /* FLOATING ELEMENTS */
        .floating-container { position: fixed; right: 20px; z-index: 1500; display: none; align-items: center; text-decoration: none; }
        .scroll-link { bottom: 105px; }
        .whatsapp-link { bottom: 30px; display: flex !important; }
        .scroll-btn { background: #1a1a1a; color: white; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* BULLE DE COMMUNIQUÉS */
        #notif-bubble {
            position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: #d4af37; border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; z-index: 2100; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); animation: lightPulse 2s infinite; border: 2px solid #fff;
        }
        @keyframes lightPulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #notif-panel {
            display: none; position: fixed; top: 80px; right: 20px; width: 290px; max-height: 75vh; overflow-y: auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 2100; padding: 20px; text-align: left; border-top: 5px solid #d4af37;
        }
        .notif-item { 
            font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 500; color: #333; line-height: 1.6; white-space: pre-wrap; margin-bottom: 10px;
        }
        .comm-count-badge {
            background: #e74c3c; color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px; margin-left: 5px; font-weight: 900; vertical-align: middle;
        }
        .close-notif { display: block; text-align: center; color: #e74c3c; font-family: 'Montserrat'; font-weight: 900; font-size: 11px; text-transform: uppercase; cursor: pointer; padding: 15px 0; border-top: 1px solid #eee; margin-top: 15px; }

        /* STATS */
        .flag-counter-box { background: white; padding: 35px 20px; border-radius: 20px; margin: 40px auto; width: 92%; max-width: 500px; border: 1px solid #f0f0f0; }
        .stat-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.1em; }
        
        /* MODAL PARTAGE */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 2500; }
        #shareModal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: white; z-index: 3000; padding: 30px 20px; border-radius: 30px 30px 0 0; text-align: center; }
        .share-options { display: flex; justify-content: space-around; margin-top: 20px; }
        .share-item { cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 12px; font-family: 'Montserrat'; font-weight: 700; }
        .share-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 8px; color: white; font-size: 20px; }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="welcome-text" id="welcome-txt">Bienvenue à EMMANUEL</div></div>

    <div id="notif-bubble" onclick="toggleNotifPanel()">
        <span style="color:white; font-size:20px;">📢</span>
    </div>
    
    <div id="notif-panel">
        <div id="notif-header" style="font-family:'Montserrat'; font-weight:900; font-size:11px; color:#d4af37; margin-bottom:15px; text-transform:uppercase;">COMMUNICATIONS</div>
        <div id="notif-list"></div>
        <span class="close-notif" onclick="supprimerTout()">✖ MASQUER ET FERMER</span>
    </div>

    <a href="javascript:void(0)" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="floating-container scroll-link" id="scrollTopLink">
        <button class="scroll-btn">↑</button>
    </a>
    
    <a href="https://wa.me/237678356844" target="_blank" class="floating-container whatsapp-link">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA" width="55">
    </a>

    <div class="lang-selector">
        <button id="btn-fr" class="lang-btn active" onclick="setLanguage('fr')">FR</button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <h1>EMMANUEL</h1>
    <div class="intro-text" id="intro-txt">La Lumière qui éclaire chaque pas sur le chemin de la Vie.</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher..." onkeyup="filtrerMessages()">
        <span class="search-icon">🔍</span>
    </div>

    <div id="flux-messages"></div>

    <button class="archive-main-btn" id="btn-archive" onclick="toggleArchives()">📂 Archives</button>
    
    <div id="archiveSection" class="archive-section">
        <div class="archive-nav-btns">
            <button id="nav-chrono" class="nav-btn active" onclick="switchArchiveView('chrono')">📅 Mois</button>
            <button id="nav-theme" class="nav-btn" onclick="switchArchiveView('theme')">📂 Thèmes</button>
        </div>
        <div id="view-chrono"><div class="month-grid" id="monthGrid"></div></div>
        <div id="view-theme" style="display:none;"><select id="themeDropdown" class="month-btn" style="width:100%" onchange="choisirThemeViaDropdown(this.value)"></select></div>
        <div id="titres-liste"></div> 
        <div id="message-detail"></div> 
    </div>

    <div class="flag-counter-box">
        <div class="stat-title" id="stat-title">COMMUNAUTÉ EMMANUEL</div>
        <a href="https://info.flagcounter.com/ivJp" target="_blank"><img src="https://s01.flagcounter.com/count2/ivJp/bg_FFFFFF/txt_000000/border_FFFFFF/columns_3/maxflags_12/viewers_3/labels_1/pageviews_1/flags_0/percent_0/?cache_refresh=1" alt="Stats" border="0" style="margin-top:20px; max-width: 100%;"></a>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="fermerPartage()"></div>
    <div id="shareModal">
        <div class="share-options">
            <div class="share-item" onclick="actionPartage('wa')"><div class="share-icon" style="background:#25D366">WA</div>WhatsApp</div>
            <div class="share-item" onclick="actionPartage('fb')"><div class="share-icon" style="background:#1877F2">FB</div>Facebook</div>
            <div class="share-item" onclick="actionPartage('copy')"><div class="share-icon" style="background:#34495E">🔗</div>Lien</div>
        </div>
        <div class="close-notif" onclick="fermerPartage()">Annuler</div>
    </div>

    <script>
        let currentLang = 'fr';
        let tousLesMessages = [];
        let msgPartageTemp = "";
        let titrePartageTemp = "";
        const translations = { fr: { welcome: "Bienvenue à EMMANUEL", intro: "La Lumière qui éclaire chaque pas sur le chemin de la Vie.", share: "Partager", copied: "Copié !", published: "Publié le" }, en: { welcome: "Welcome to EMMANUEL", intro: "The Light that guides every step on the path of Life.", share: "Share", copied: "Copied!", published: "Published on" } };

        async function chargerMessages() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                
                // --- LOGIQUE COMMUNIQUÉ & COMPTEUR ---
                if (data.communique && data.communique.trim() !== "") {
                    // Compter les paragraphes (blocs séparés par des retours à la ligne)
                    const paras = data.communique.split(/\n+/).filter(p => p.trim() !== "");
                    const totalMessages = paras.length;

                    document.getElementById('notif-bubble').style.display = 'flex';
                    document.getElementById('notif-header').innerHTML = `COMMUNICATIONS <span class="comm-count-badge">${totalMessages} message(s)</span>`;
                    document.getElementById('notif-list').innerHTML = `<div class="notif-item">${data.communique}</div>`;
                }

                if (data.status === "standby") {
                    document.body.innerHTML = `<div style="height:100vh; display:flex; justify-content:center; align-items:center; background:#1a1a1a; color:#d4af37; text-align:center; padding:20px;"><h1 style="color:#d4af37;">🏛️ EMMANUEL</h1><p>Le sanctuaire est momentanément fermé.</p></div>`;
                    return;
                }
                
                const listeBrute = data.messages || [];
                const maintenant = new Date();
                const heureLocale = new Date(maintenant.getTime() + (maintenant.getTimezoneOffset() * 60000) + (3600000));
                tousLesMessages = listeBrute.filter(msg => {
                    const [annee, mois, jour] = msg.date.split('-').map(Number);
                    const dateParution = new Date(annee, mois - 1, jour, 0, 0, 1);
                    return heureLocale >= dateParution;
                });

                afficherAccueil();
                genererBoutonsMois();

                const loader = document.getElementById('loading-screen');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => { loader.style.display = 'none'; }, 500); }
            } catch (err) { console.error(err); }
        }

        // --- FONCTIONS DE LA BULLE ---
        function toggleNotifPanel() {
            const panel = document.getElementById('notif-panel');
            const bubble = document.getElementById('notif-bubble');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                bubble.style.display = 'flex';
            } else {
                panel.style.display = 'block';
                bubble.style.display = 'none';
            }
        }

        function supprimerTout() {
            // Cette fonction cache le panneau ET la bulle définitivement pour la session
            document.getElementById('notif-panel').style.display = 'none';
            document.getElementById('notif-bubble').style.display = 'none';
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('welcome-txt').innerText = translations[lang].welcome;
            document.getElementById('intro-txt').innerText = translations[lang].intro;
            afficherAccueil();
        }

        function creerCard(msg) {
            const titre = (currentLang === 'en' && msg.titre_en) ? msg.titre_en : msg.titre;
            const texte = (currentLang === 'en' && msg.texte_en) ? msg.texte_en : msg.texte;
            const texteFormate = texte.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            let img = msg.image ? `<img src="${msg.image}" class="msg-img">` : '';
            return `<div class="message-card">${img}<h3 class="msg-title">${titre}</h3><div class="msg-content">${texteFormate}</div><button class="copy-btn" onclick="ouvrirMenuPartage('${btoa(unescape(encodeURIComponent(titre)))}', '${btoa(unescape(encodeURIComponent(texte)))}')">${translations[currentLang].share}</button></div>`;
        }

        function ouvrirMenuPartage(t, txt) {
            titrePartageTemp = decodeURIComponent(escape(atob(t)));
            msgPartageTemp = decodeURIComponent(escape(atob(txt))).replace(/\*\*/g, '');
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('shareModal').style.display = 'block';
        }
        function fermerPartage() { document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('shareModal').style.display = 'none'; }

        function actionPartage(type) {
            const msg = `${titrePartageTemp}\n\n${msgPartageTemp}\n\nhttps://emmanuel-dpv.pages.dev`;
            if (type === 'wa') window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg), '_blank');
            else if (type === 'copy') { navigator.clipboard.writeText(msg); alert(translations[currentLang].copied); }
            fermerPartage();
        }

        function afficherAccueil() { 
            const derniers = [...tousLesMessages].sort((a, b) => b.id - a.id).slice(0, 3); 
            document.getElementById('flux-messages').innerHTML = derniers.map(msg => creerCard(msg)).join(''); 
        }

        function toggleArchives() { 
            const s = document.getElementById('archiveSection'); 
            s.style.display = (s.style.display === 'block') ? 'none' : 'block'; 
        }

        function genererBoutonsMois() {
            const mois = ["Jan", "Fév", "Mar", "Avr", "Mai", "Jui", "Juil", "Aoû", "Sep", "Oct", "Nov", "Déc"];
            document.getElementById('monthGrid').innerHTML = mois.map((n, i) => `<button class="month-btn" onclick="afficherMois(${i+1}, this)">${n}</button>`).join('');
        }

        function afficherMois(m, btn) {
            document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = tousLesMessages.filter(msg => (new Date(msg.date).getMonth() + 1) === m);
            document.getElementById('titres-liste').innerHTML = filtered.map(msg => `<div class="titre-archive-item" onclick="voirDetail(${msg.id})">📖 ${msg.titre}</div>`).join('');
        }

        function voirDetail(id) {
            const msg = tousLesMessages.find(m => m.id === id);
            document.getElementById('message-detail').innerHTML = creerCard(msg);
            document.getElementById('titres-liste').innerHTML = '';
        }

        window.onscroll = function() { 
            let top = document.getElementById("scrollTopLink"); 
            top.style.display = (window.scrollY > 400) ? "flex" : "none"; 
        };
        
        chargerMessages();
    </script>
</body>
</html>
