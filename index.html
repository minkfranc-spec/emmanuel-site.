<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMMANUEL | La Lumière qui éclaire vos pas</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background: #fdfdfd; font-family: 'Lora', serif; text-align: center; overflow-x: hidden; }
        
        .gold-text { color: #d4af37; font-family: 'Montserrat'; font-weight: 900; }
        
        /* --- POINT : BOUTONS AU MILIEU AVEC VEILLEUSE ROUGE --- */
        .lang-container { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .lang-btn { 
            background: #f0f0f0; border: 1px solid #ddd; padding: 6px 15px; 
            border-radius: 50px; cursor: pointer; font-family: 'Montserrat'; 
            font-weight: 900; font-size: 11px; color: #888; transition: all 0.4s ease;
        }
        .lang-btn.active { 
            background: #ff0000; color: white; border-color: #b30000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); transform: scale(1.1);
        }

        /* --- NOTIFICATION & LAMPE --- */
        #sanctuary-light-wrapper { position: fixed; right: 20px; top: 20px; z-index: 5000; }
        #altar-lamp { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; animation: shiver 0.6s infinite alternate; }
        .flame-core { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #d4af37, 0 0 40px #ffcc00, 0 0 60px #d4af37; animation: flicker 1s infinite; }
        
        @keyframes shiver { from { transform: translate(0,0); } to { transform: translate(1px, 1px); } }
        @keyframes flicker { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); opacity: 0.9; } }

        #notif-panel { position: fixed; right: -320px; top: 0; height: 100vh; width: 280px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border-left: 3px solid #d4af37; padding: 40px 25px; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 4999; text-align: left; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        #notif-panel.active { right: 0; }
        .close-notif { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; font-weight: 900; color: #d4af37; }

        /* --- ARCHIVES ÉPURÉES ET DORÉES --- */
        .archive-section { margin: 40px auto; width: 92%; max-width: 540px; }
        .archive-main-btn { background: #1a1a1a; color: white; padding: 15px 35px; border-radius: 50px; border: none; cursor: pointer; font-family: 'Montserrat'; font-weight: 700; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .archive-main-btn:hover { background: #d4af37; transform: translateY(-2px); }
        
        #archive-box { display: none; background: white; padding: 25px; border-radius: 20px; border: 2px solid #d4af37; box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15); animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .months-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 20px; padding: 10px; background: #fffcf5; border-radius: 12px; border: 1px inset #d4af37; }
        .month-btn { background: white; border: 1px solid #eee; padding: 12px 2px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat'; font-size: 9px; font-weight: 900; color: #777; transition: 0.3s; }
        .month-btn.active { background: #d4af37 !important; color: white !important; border-color: #d4af37; box-shadow: 0 4px 10px rgba(212,175,55,0.4); }

        .title-item { padding: 18px; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-family: 'Montserrat'; font-weight: 700; font-size: 0.9em; transition: 0.3s; animation: titleDance 4s infinite ease-in-out; }
        .title-item:hover { color: #d4af37; background: #fffdf9; }
        @keyframes titleDance { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }

        /* --- MESSAGES --- */
        .message-card { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 92%; max-width: 540px; margin: 30px auto; text-align: left; border-top: 6px solid #d4af37; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .message-card:hover { transform: translateY(-12px); box-shadow: 0 20px 50px rgba(212, 175, 55, 0.15); }
        .msg-img { width: 100%; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* --- COMPTEUR --- */
        .flag-counter-box { background: white; padding: 35px 20px; border-radius: 24px; margin: 50px auto; width: 92%; max-width: 500px; border: 1px solid #f0f0f0; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

    <audio id="bellSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <div class="lang-container">
        <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FRANÇAIS</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">ENGLISH</button>
    </div>

    <div id="sanctuary-light-wrapper">
        <div id="altar-lamp" onclick="toggleCommunion(true)">
            <div class="flame-core"></div>
            <span style="font-size: 22px; position: relative; z-index: 3;">🕯️</span>
        </div>
        <div id="notif-panel">
            <div class="close-notif" onclick="toggleCommunion(false)">×</div>
            <h3 class="gold-text" style="font-size:10px; letter-spacing:4px; margin-bottom:20px;">COMMUNION</h3>
            <p style="font-size:0.85em; line-height:1.8;">Le Sanctuaire numérique est ouvert.<br>Adresse : <strong style="color:#d4af37;">emmanuel-dpv.pages.dev</strong></p>
            <p style="font-style: italic; color: #bbb; font-size: 0.75em; margin-top:40px;">"Que la paix soit avec vous."</p>
        </div>
    </div>

    <h1 class="gold-text" style="font-size: 2.8em; margin-top: 50px; margin-bottom: 5px; letter-spacing: -1px;">EMMANUEL</h1>
    <p style="font-family:'Montserrat'; letter-spacing:3px; color:#d4af37; font-weight: 700; font-size: 10px; text-transform: uppercase; margin-bottom: 40px; opacity: 0.8;">La Lumière qui éclaire vos pas</p>

    <div id="flux-messages"></div>

    <div class="archive-section">
        <button class="archive-main-btn" id="btn-toggle-archives" onclick="openArchiveBox()">📂 Archives du Sanctuaire</button>
        <div id="archive-box">
            <div class="months-grid">
                <button class="month-btn" id="m-01" onclick="selectMonth('01')">JAN</button>
                <button class="month-btn" id="m-02" onclick="selectMonth('02')">FEV</button>
                <button class="month-btn" id="m-03" onclick="selectMonth('03')">MAR</button>
                <button class="month-btn" id="m-04" onclick="selectMonth('04')">AVR</button>
                <button class="month-btn" id="m-05" onclick="selectMonth('05')">MAI</button>
                <button class="month-btn" id="m-06" onclick="selectMonth('06')">JUIN</button>
                <button class="month-btn" id="m-07" onclick="selectMonth('07')">JUIL</button>
                <button class="month-btn" id="m-08" onclick="selectMonth('08')">AOUT</button>
                <button class="month-btn" id="m-09" onclick="selectMonth('09')">SEPT</button>
                <button class="month-btn" id="m-10" onclick="selectMonth('10')">OCT</button>
                <button class="month-btn" id="m-11" onclick="selectMonth('11')">NOV</button>
                <button class="month-btn" id="m-12" onclick="selectMonth('12')">DEC</button>
            </div>
            <div id="archive-view">
                <div id="titles-container" style="display:none;">
                    <ul style="list-style:none; padding:0;" id="list-titles"></ul>
                    <button style="background:#f0f0f0; border:none; padding:10px 25px; border-radius:30px; font-size:10px; font-family:'Montserrat'; font-weight:900; cursor:pointer; color:#d4af37;" onclick="showMonthsOnly()">⬅ RETOUR AUX MOIS</button>
                </div>
                <div id="selected-msg-container"></div>
            </div>
        </div>
    </div>

    <div class="flag-counter-box">
        <div style="font-family:'Montserrat'; font-weight:900; font-size:1em; letter-spacing:1px; color:#1a1a1a;">LECTEURS PAR PAYS</div>
        <a href="https://info.flagcounter.com/ivJp" target="_blank">
            <img src="https://s01.flagcounter.com/count2/ivJp/bg_FFFFFF/txt_000000/border_FFFFFF/columns_3/maxflags_12/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag" border="0" style="margin-top:20px; border-radius:8px;">
        </a>
        <div style="font-family:'Montserrat'; font-size:9px; color:#aaa; margin-top:20px; font-weight:700; text-transform:uppercase;">
            Actualisation : 15 min | <span style="font-weight:400; font-style:italic;">Updates: 15 min</span>
        </div>
    </div>

    <script>
        let currentLang = 'fr';
        let tousLesMessages = [];

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            afficherFlux();
        }

        function toggleCommunion(s) { document.getElementById('notif-panel').classList.toggle('active', s); if(s) document.getElementById('bellSound').play(); }

        async function charger() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                const now = new Date();
                const heureCam = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 3600000);
                tousLesMessages = data.messages.filter(msg => {
                    const [a, m, j] = msg.date.split('-').map(Number);
                    return heureCam >= new Date(a, m - 1, j);
                });
                afficherFlux();
            } catch (e) { console.error(e); }
        }

        function afficherFlux() {
            const container = document.getElementById('flux-messages');
            container.innerHTML = [...tousLesMessages].sort((a,b) => b.id - a.id).slice(0, 3).map(msg => creerCard(msg)).join('');
        }

        function openArchiveBox() {
            const box = document.getElementById('archive-box');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
            if(box.style.display === 'block') showMonthsOnly();
        }

        function selectMonth(m) {
            document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('m-'+m).classList.add('active');
            const messagesMois = tousLesMessages.filter(msg => msg.date.split('-')[1] === m).sort((a,b) => a.id - b.id);
            const list = document.getElementById('list-titles');
            list.innerHTML = messagesMois.length ? messagesMois.map(msg => `<li class="title-item" onclick="voirMessage(${msg.id})">${msg.titre}</li>`).join('') : "<li style='padding:20px; font-size:0.8em; color:#999;'>Aucun message.</li>";
            document.getElementById('titles-container').style.display = 'block';
            document.getElementById('selected-msg-container').innerHTML = '';
            document.querySelector('.months-grid').style.display = 'none';
        }

        function showMonthsOnly() {
            document.getElementById('titles-container').style.display = 'none';
            document.getElementById('selected-msg-container').innerHTML = '';
            document.querySelector('.months-grid').style.display = 'grid';
        }

        function voirMessage(id) {
            const msg = tousLesMessages.find(m => m.id === id);
            document.getElementById('selected-msg-container').innerHTML = creerCard(msg) + `<button style="background:#f1f1f1; border:none; padding:12px 25px; border-radius:30px; font-family:'Montserrat'; font-size:10px; font-weight:900; cursor:pointer; margin-top:20px; color:#d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onclick="selectMonth('${msg.date.split('-')[1]}')">⬅ RETOUR AUX TITRES</button>`;
            document.getElementById('titles-container').style.display = 'none';
        }

        function creerCard(msg) {
            return `<div class="message-card">
                ${msg.image ? `<img src="${msg.image}" class="msg-img">` : ''}
                <h3 class="gold-text" style="text-align:center; text-transform:uppercase; font-size:1.2em; margin-bottom:20px;">${msg.titre}</h3>
                ${msg.audio ? `<audio src="${msg.audio}" controls style="width:100%; margin:20px 0; border-radius:10px;"></audio>` : ''}
                <div style="text-align:justify; line-height:1.7; white-space:pre-line; color:#2c3e50;">${msg.texte.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
                <p style="text-align:right; font-size:0.75em; color:#d4af37; font-weight:700; margin-top:25px; border-top: 1px solid #f9f9f9; padding-top:10px;">Publié le ${msg.date}</p>
            </div>`;
        }
        charger();
    </script>
</body>
</html>
