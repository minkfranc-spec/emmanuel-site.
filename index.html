<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMMANUEL | La Voix de la Vérité</title>

    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; scroll-behavior: smooth; }
        html, body { 
            margin: 0; padding: 0; width: 100%; 
            background: #fdfdfd; color: #1a1a1a; 
            font-family: 'Lora', serif; text-align: center; 
            overflow-x: hidden;
        }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .welcome-text { font-family: 'Montserrat', sans-serif; font-size: 1.6em; font-weight: 700; color: #d4af37; letter-spacing: 6px; text-transform: uppercase; border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37; padding: 20px 40px; }

        /* --- NOTIFICATIONS --- */
        #sanctuary-light-wrapper { position: fixed; right: 20px; top: 20px; z-index: 5000; }
        #altar-lamp { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        #notif-count { background: #e74c3c; color: #fff; font-weight: bold; font-family: 'Montserrat'; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; position: absolute; top: 2px; right: 2px; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .flame-core { position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #d4af37, 0 0 30px #ffcc00; z-index: 2; animation: flicker 1.5s infinite; }
        .flame-glow { position: absolute; width: 120%; height: 120%; background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, rgba(212, 175, 55, 0) 70%); border-radius: 50%; animation: breathe 3s infinite; }
        
        #notif-panel { position: fixed; right: -320px; top: 0; height: 100vh; width: 300px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-left: 2px solid #d4af37; padding: 60px 25px; transition: 0.5s ease; z-index: 4999; text-align: left; box-shadow: -10px 0 30px rgba(0,0,0,0.1); overflow-y: auto; }
        #notif-panel.active { right: 0; }
        .close-notif { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: #1a1a1a; font-family: 'Montserrat'; font-weight: 900; }

        /* --- ARCHIVES --- */
        #archive-panel { display: none; padding: 20px; background: #f9f9f9; border-radius: 15px; margin: 20px auto; width: 92%; max-width: 540px; }
        .month-btn { background: white; border: 1px solid #d4af37; color: #d4af37; padding: 10px 20px; margin: 5px; border-radius: 20px; font-family: 'Montserrat'; font-weight: 700; cursor: pointer; font-size: 0.8em; }
        .month-btn:hover { background: #d4af37; color: white; }
        .archive-main-btn { font-family: 'Montserrat', sans-serif; background: #1a1a1a; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; display: block; margin: 30px auto; text-transform: uppercase; letter-spacing: 1px; }

        /* --- MESSAGES --- */
        .message-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 92%; max-width: 540px; margin: 25px auto; text-align: left; border-top: 6px solid #d4af37; }
        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .msg-title { font-family: 'Montserrat', sans-serif; text-align: center; color: #1a1a1a; font-size: 1.1em; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        .msg-content { text-align: justify; line-height: 1.6; white-space: pre-line; }

        /* --- COMPTEUR --- */
        .flag-counter-box { background: white; padding: 30px; border-radius: 20px; margin: 40px auto; width: 92%; max-width: 500px; border: 1px solid #f0f0f0; }
        
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.6); opacity: 0.7; } }
        @keyframes flicker { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.9); } }
    </style>
</head>
<body>

    <audio id="bellSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <div id="loading-screen"><div class="welcome-text">Bienvenue</div></div>

    <div id="sanctuary-light-wrapper">
        <div id="altar-lamp" onclick="toggleCommunion(true)">
            <span id="notif-count">1</span>
            <div class="flame-glow"></div><div class="flame-core"></div>
            <span style="font-size: 20px; position: relative; z-index: 3;">🕯️</span>
        </div>
        <div id="notif-panel">
            <div class="close-notif" onclick="toggleCommunion(false)">×</div>
            <h3 style="color:#d4af37; font-family:'Montserrat'; font-size:12px; letter-spacing:3px; margin-bottom:30px;">COMMUNION</h3>
            <div style="margin-bottom:20px;">
                <span style="font-family:'Montserrat'; font-size:9px; color:#d4af37; font-weight:900;">📢 ANNONCE</span>
                <p style="font-size:0.9em;">Adresse officielle : <strong>emmanuel-dpv.pages.dev</strong></p>
            </div>
            <div style="font-style: italic; color: #95a5a6; font-size: 0.8em; border-top: 1px solid #eee; padding-top: 20px;">
                "La Lumière du Sanctuaire reste allumée sur l'Autel pour éclairer votre journée." 🕯️
            </div>
        </div>
    </div>

    <h1>EMMANUEL</h1>
    <p style="font-family:'Montserrat'; font-weight:700; letter-spacing:2px; color:#95a5a6;">LA VOIX DE LA VÉRITÉ</p>

    <div id="flux-messages"></div>

    <button class="archive-main-btn" onclick="document.getElementById('archive-panel').style.display='block'">📂 Consulter les Archives</button>
    
    <div id="archive-panel">
        <div id="month-list"></div>
        <div id="archive-content" style="margin-top:20px;"></div>
    </div>

    <div class="flag-counter-box">
        <div style="font-family:'Montserrat'; font-weight:900;">COMMUNAUTÉ EMMANUEL</div>
        <div style="color:#d4af37; font-size:0.8em; margin-bottom:15px; font-weight:700;">✨ Lecteurs par pays et vues ✨</div>
        <a href="https://info.flagcounter.com/ivJp">
            <img src="https://s01.flagcounter.com/count2/ivJp/bg_FFFFFF/txt_000000/border_FFFFFF/columns_3/maxflags_12/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0">
        </a>
    </div>

    <script>
        let tousLesMessages = [];
        const moisNoms = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

        function toggleCommunion(show) {
            if (show) {
                document.getElementById('notif-panel').classList.add('active');
                document.getElementById('bellSound').play();
                document.getElementById('notif-count').style.display = 'none';
            } else {
                document.getElementById('notif-panel').classList.remove('active');
            }
        }

        async function chargerMessages() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                
                const maintenant = new Date();
                const heureCameroun = new Date(maintenant.getTime() + (maintenant.getTimezoneOffset() * 60000) + (3600000));
                
                tousLesMessages = data.messages.filter(msg => {
                    const [a, m, j] = msg.date.split('-').map(Number);
                    return heureCameroun >= new Date(a, m - 1, j);
                });

                afficherFlux();
                genererMoisArchives();
                document.getElementById('loading-screen').style.display = 'none';
            } catch (err) { console.error(err); }
        }

        function afficherFlux() {
            const container = document.getElementById('flux-messages');
            container.innerHTML = [...tousLesMessages].sort((a,b) => b.id - a.id).slice(0, 3).map(msg => creerCard(msg)).join('');
        }

        function genererMoisArchives() {
            const moisPresents = [...new Set(tousLesMessages.map(msg => msg.date.split('-')[1]))];
            const list = document.getElementById('month-list');
            list.innerHTML = moisPresents.map(m => `<button class="month-btn" onclick="filtrerParMois('${m}')">${moisNoms[parseInt(m)-1]}</button>`).join('');
        }

        function filtrerParMois(m) {
            const filtered = tousLesMessages.filter(msg => msg.date.split('-')[1] === m);
            document.getElementById('archive-content').innerHTML = filtered.map(msg => creerCard(msg)).join('');
        }

        function creerCard(msg) {
            return `
                <div class="message-card">
                    ${msg.image ? `<img src="${msg.image}" class="msg-img">` : ''}
                    <h3 class="msg-title">${msg.titre}</h3>
                    ${msg.audio ? `<audio src="${msg.audio}" controls style="width:100%; margin-bottom:15px;"></audio>` : ''}
                    <div class="msg-content">${msg.texte.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
                    <span style="display:block; text-align:right; color:#d4af37; font-size:0.8em; margin-top:15px;">Publié le ${msg.date}</span>
                </div>`;
        }

        chargerMessages();
    </script>
</body>
</html>
