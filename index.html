    <title>EMMANUEL | La Voix de la Vérité</title>

    <link rel="canonical" href="https://emmanuel-dpv.pages.dev">
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/RCwdK4zr/jesus2.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        /* VOTRE STYLE PARFAIT INCHANGÉ */
        * { box-sizing: border-box; scroll-behavior: smooth; }
        html, body { margin: 0; padding: 0; width: 100%; background: #fdfdfd; color: #1a1a1a; font-family: 'Lora', serif; text-align: center; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease-in-out; }
        .welcome-text { font-family: 'Montserrat', sans-serif; font-size: 1.6em; font-weight: 700; color: #d4af37; letter-spacing: 6px; text-transform: uppercase; border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37; padding: 20px 40px; animation: welcomeEntry 2s forwards; opacity: 0; }
        @keyframes welcomeEntry { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes blockDance { 0% { opacity: 0; transform: scale(0.95) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        
        /* Bulle de communiqué et Bouton Lecture */
        #notif-bubble { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; background: #d4af37; border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; z-index: 2100; box-shadow: 0 0 15px rgba(212,175,55,0.4); border: 2px solid #fff; }
        #auto-scroll-btn { position: fixed; top: 75px; right: 20px; width: 45px; height: 45px; background: #1a1a1a; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 2100; box-shadow: 0 0 10px rgba(0,0,0,0.2); border: 2px solid #fff; transition: 0.3s; }
        #auto-scroll-btn:active { transform: scale(0.9); }

        /* Le reste du style original */
        .lang-selector { margin: 15px 0 15px; display: inline-flex; background: #f1f1f1; padding: 4px; border-radius: 30px; border: 1px solid #eee; }
        .lang-btn { font-family: 'Montserrat', sans-serif; font-weight: 700; padding: 8px 18px; border-radius: 25px; border: none; cursor: pointer; transition: all 0.4s ease; background: transparent; color: #95a5a6; font-size: 10px; letter-spacing: 1px; }
        .lang-btn.active { background: #fff; color: #e74c3c; border: 1px solid #d4af37; box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.6), 0 0 10px rgba(212, 175, 55, 0.3); }
        h1 { font-family: 'Montserrat', sans-serif; color: #1a1a1a; text-transform: uppercase; font-weight: 900; font-size: 1.8em; margin: 15px 0 5px 0; }
        .intro-text { width: 85%; margin: 0 auto 10px auto; font-size: 1.1em; color: #95a5a6; font-style: italic; }
        .search-container { position: relative; width: 85%; max-width: 400px; margin: 0 auto 25px; }
        .search-input { width: 100%; padding: 12px 40px 12px 20px; border-radius: 30px; border: 1px solid #eee; font-family: 'Montserrat', sans-serif; outline: none; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #d4af37; }
        .message-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 92%; max-width: 540px; margin: 25px auto; text-align: left; border-top: 6px solid #d4af37; animation: blockDance 0.8s ease-out forwards; }
        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .msg-title { font-family: 'Montserrat', sans-serif; text-align: center; margin: 10px 0 15px 0; color: #1a1a1a; font-size: 1.15em; font-weight: 900; text-transform: uppercase; }
        .msg-content { text-align: justify; line-height: 1.6; font-size: 1.05em; white-space: pre-line; color: #1a1a1a; }
        .copy-btn { font-family: 'Montserrat', sans-serif; background: transparent; border: 2px solid #d4af37; color: #d4af37; padding: 14px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 700; text-transform: uppercase; margin: 20px 0; }
        .archive-main-btn { font-family: 'Montserrat', sans-serif; background: #1a1a1a; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; display: block; margin: 20px auto; text-transform: uppercase; }
        .floating-container { position: fixed; right: 20px; z-index: 1500; display: none; }
        .scroll-link { bottom: 105px; }
        .whatsapp-link { bottom: 30px; display: flex !important; }
        .scroll-btn { background: #1a1a1a; color: white; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body onclick="demarrerAmbiance()">

    <audio id="bg-music" loop><source src="adoration1.mp3" type="audio/mpeg"></audio>

    <div id="loading-screen"><div class="welcome-text">Bienvenue à EMMANUEL</div></div>

    <div id="notif-bubble" onclick="alert('Communiqué : ' + document.getElementById('notif-list').innerText)">
        <span style="color:white; font-size:18px;">🔔</span>
    </div>

    <div id="auto-scroll-btn" onclick="activerLectureAuto()" title="Lecture Automatique">
        <span style="color:white; font-size:18px;">▶️</span>
    </div>

    <a href="javascript:void(0)" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="floating-container scroll-link" id="scrollTopLink">
        <button class="scroll-btn">↑</button>
    </a>
    
    <a href="https://wa.me/237678356844" target="_blank" class="floating-container whatsapp-link">
        <div><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="60"></div>
    </a>

    <div class="lang-selector">
        <button id="btn-fr" class="lang-btn active" onclick="setLanguage('fr')">FR</button>
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <h1>EMMANUEL</h1>
    <div class="intro-text">La Lumière qui éclaire chaque pas sur le chemin de la Vie.</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un message..." onkeyup="filtrerMessages()">
        <span class="search-icon">🔍</span>
    </div>

    <div id="flux-messages"></div>
    <div id="notif-list" style="display:none;"></div>

    <button class="archive-main-btn" onclick="toggleArchives()">📂 Consulter les Archives</button>
    
    <div id="archiveSection" style="display:none;">
        <div id="titres-liste"></div>
        <div id="message-detail"></div>
    </div>

    <div style="margin: 20px auto;">
        <a href="https://info.flagcounter.com/ivJp"><img src="https://s01.flagcounter.com/count2/ivJp/bg_FFFFFF/txt_000000/border_FFFFFF/columns_3/maxflags_12/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0"></a>
    </div>

    <script>
        let tousLesMessages = [];
        let messagesAffiches = 3;
        let isSearching = false;
        let musicStarted = false;
        let scrollInterval;

        async function chargerMessages() {
            try {
                const res = await fetch('data.json?v=' + Date.now());
                const data = await res.json();
                tousLesMessages = data.messages || [];
                if(data.communique) {
                    document.getElementById('notif-bubble').style.display = 'flex';
                    document.getElementById('notif-list').innerText = data.communique;
                }
                afficherAccueil();
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 500);
            } catch (err) { console.error(err); }
        }

        function creerCard(msg) {
            const texte = msg.texte || "";
            let imgHtml = msg.image ? `<img src="${msg.image}" class="msg-img">` : '';
            return `<div class="message-card">
                ${imgHtml}
                <h3 class="msg-title">${msg.titre}</h3>
                <div class="msg-content">${texte.replace(/\*\?(.*?)\*\?/g, '<strong>$1</strong>')}</div>
                <button class="copy-btn">Partager</button>
            </div>`;
        }

        function afficherAccueil() {
            const container = document.getElementById('flux-messages');
            const trie = [...tousLesMessages].sort((a, b) => b.id - a.id);
            container.innerHTML = trie.slice(0, messagesAffiches).map(msg => creerCard(msg)).join('');
        }

        function activerLectureAuto() {
            // Change l'icône pour montrer que c'est actif
            document.getElementById('auto-scroll-btn').innerHTML = '<span style="color:#d4af37; font-size:18px;">⏳</span>';
            // Défilement automatique lent
            scrollInterval = setInterval(() => {
                window.scrollBy(0, 1);
            }, 30);
        }

        function demarrerAmbiance() {
            if (!musicStarted) {
                const audio = document.getElementById('bg-music');
                audio.volume = 0.1; audio.play(); musicStarted = true;
            }
        }

        function filtrerMessages() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('flux-messages');
            if (query === "") { isSearching = false; afficherAccueil(); return; }
            isSearching = true;
            const res = tousLesMessages.filter(msg => (msg.titre+msg.texte).toLowerCase().includes(query));
            container.innerHTML = res.map(msg => creerCard(msg)).join('');
        }

        window.onscroll = function() {
            let btn = document.getElementById("scrollTopLink");
            if (window.scrollY > 400) btn.style.display = "flex"; else btn.style.display = "none";
            
            if (!isSearching && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (messagesAffiches < tousLesMessages.length) {
                    messagesAffiches += 2;
                    afficherAccueil();
                }
            }
        };

        chargerMessages();
    </script>
</body>
</html>
