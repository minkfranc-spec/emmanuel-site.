<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141d">
  <meta name="description" content="Lire et rechercher les messages de data2.json.">
  <title>Messages · EMMANUEL</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10141d;
      --panel: #191f2b;
      --panel-raised: #202837;
      --line: #30394a;
      --text: #f3f4f6;
      --muted: #adb5c3;
      --gold: #e1bd51;
      --danger: #ffb4a9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 0 0 calc(148px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button, input, audio { font: inherit; }

    button, a, input { -webkit-tap-highlight-color: transparent; }

    a { color: inherit; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 44px;
      padding: 6px max(12px, env(safe-area-inset-left));
      background: rgba(16, 20, 29, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .brand {
      min-width: 0;
      font-weight: 800;
      font-size: .9rem;
      letter-spacing: .08em;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: .62rem;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .site-link {
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid rgba(225,189,81,.55);
      border-radius: 999px;
      color: var(--gold);
      font-size: .75rem;
      font-weight: 700;
      text-decoration: none;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 8px 10px 20px;
    }

    .search-box {
      position: sticky;
      top: 44px;
      z-index: 4;
      padding: 5px 0 6px;
      background: var(--bg);
    }

    .search-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .search-label {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
    }

    .search-actions button {
      min-height: 32px;
      padding: 5px 9px;
      border: 1px solid rgba(225,189,81,.55);
      border-radius: 8px;
      background: var(--panel);
      color: var(--gold);
      font-size: .75rem;
      font-weight: 700;
    }

    .search-input-wrap { position: relative; }

    #search {
      width: 100%;
      min-height: 42px;
      padding: 9px 42px 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: .95rem;
    }

    #search:focus { border-color: var(--gold); }

    #search::placeholder { color: #939cac; }

    #clear-search {
      position: absolute;
      top: 50%;
      right: 6px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
      transform: translateY(-50%);
    }

    #clear-search:hover { background: var(--panel-raised); color: var(--text); }

    #favorite-panel { margin: 0 0 8px; }

    #favorite-list {
      display: grid;
      gap: 6px;
    }

    .favorite-item {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .favorite-item strong, .favorite-item span { display: block; }
    .favorite-item span { margin-top: 2px; color: var(--muted); font-size: .72rem; }

    #return-favorites {
      margin: 0 0 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--gold);
      font-size: .78rem;
      font-weight: 700;
    }

    #search-summary {
      min-height: 0;
      margin-top: 3px;
      color: var(--muted);
      font-size: .7rem;
    }

    .data-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0 2px;
      color: var(--muted);
      font-size: .68rem;
    }

    .data-toolbar span { margin-right: auto; }

    #refresh-data, #format-audit {
      min-height: 28px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
    }

    #refresh-data:disabled, #format-audit:disabled { opacity: .55; }

    #format-audit[aria-pressed="true"] {
      border-color: var(--gold);
      background: var(--gold);
      color: #171717;
    }

    .audit-issues {
      margin: 8px 0 0;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--danger);
      font-size: .78rem;
      overflow-wrap: anywhere;
    }

    .list-summary {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px 6px;
      color: var(--muted);
      font-size: .72rem;
    }

    #message-list {
      display: grid;
      gap: 8px;
    }

    .message {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      scroll-margin-top: 110px;
    }

    .message.is-playing {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(225,189,81,.16);
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 4px 8px;
      color: var(--muted);
      font-size: .72rem;
    }

    .message-id {
      color: var(--gold);
      font-weight: 800;
    }

    .favorite-toggle {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      margin-left: auto;
      border: 1px solid rgba(225,189,81,.55);
      border-radius: 50%;
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      font-size: .9rem;
    }

    .favorite-toggle.is-favorite {
      border-color: var(--danger);
      background: rgba(255,180,169,.1);
      color: var(--danger);
    }

    .message h2 {
      margin: 6px 0 5px;
      font-size: 1.05rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .category {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .message-image {
      display: block;
      width: 100%;
      max-height: 300px;
      margin: 8px 0;
      border-radius: 10px;
      object-fit: cover;
    }

    .message-text {
      margin: 0;
      font-size: .93rem;
      color: #e5e8ee;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-text strong { color: #fff1bd; }

    .message-play {
      min-height: 38px;
      margin-top: 10px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-raised);
      color: var(--text);
      font-size: .85rem;
      font-weight: 700;
    }

    .empty-state {
      padding: 22px 16px;
      border: 1px dashed var(--line);
      border-radius: 15px;
      color: var(--muted);
      text-align: center;
    }

    .player {
      position: fixed;
      inset: auto 0 0;
      z-index: 10;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(25,31,43,.98);
      box-shadow: 0 -6px 20px rgba(0,0,0,.25);
      backdrop-filter: blur(16px);
    }

    .player-inner {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .player-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: .75rem;
    }

    .player-heading strong { font-size: .75rem; color: var(--muted); font-weight: 600; }

    #player-status {
      min-width: 0;
      overflow: hidden;
      color: var(--gold);
      font-size: .72rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    .player-controls button {
      min-height: 38px;
      padding: 6px 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-raised);
      color: var(--text);
      font-size: .78rem;
      font-weight: 700;
    }

    .player-controls button.is-active,
    .message-play.is-active {
      border-color: var(--gold);
      background: var(--gold);
      color: #171717;
    }

    /* Lecteur — état au repos : masque Pause/Arrêter + progression */
    .player-controls #toggle-play,
    .player-controls #stop-play {
      display: none;
    }
    #audio-player,
    .playback-progress {
      display: none;
    }

    /* Lecteur — état en lecture : tout visible */
    .player.is-playing .player-controls #toggle-play,
    .player.is-playing .player-controls #stop-play {
      display: block;
    }
    .player.is-playing #audio-player {
      display: block;
      width: 100%;
      height: 32px;
      margin-top: 5px;
    }
    .player.is-playing .playback-progress {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .native-audio #audio-player { display: none !important; }

    .playback-progress {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    #playback-seek {
      width: 100%;
      min-width: 0;
      accent-color: var(--gold);
    }

    #playback-time {
      min-width: 82px;
      color: var(--muted);
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .back-to-top {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(158px + env(safe-area-inset-bottom));
      z-index: 11;
      display: grid;
      place-items: center;
      width: 40px;
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid rgba(225,189,81,.7);
      border-radius: 50%;
      background: var(--panel-raised);
      color: var(--gold);
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
    }

    .back-to-top[hidden] { display: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 700px) {
      body { padding-bottom: 148px; }
      main { padding: 20px 20px 36px; }
      .message { padding: 16px; }
      .player { padding-right: 20px; padding-left: 20px; }
    }

    @media (max-width: 360px) {
      main { padding-right: 8px; padding-left: 8px; }
      .message { padding: 10px; }
      .player-controls { gap: 4px; }
      .player-controls button { font-size: .7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">EMMANUEL<small>emmanuel-dpv · messages</small></div>
    <a class="site-link" href="https://emmanuel-dpv.pages.dev/" target="_blank" rel="noopener noreferrer" onclick="if(window.PublicSiteOpener){window.PublicSiteOpener.postMessage('open');return false;}">Voir le site ↗</a>
  </header>

  <main>
    <p id="load-status" role="status" aria-live="polite" style="margin:4px 2px 0;color:var(--muted);font-size:.72rem;">Chargement…</p>

    <div class="data-toolbar">
      <span id="audit-count" role="status" aria-live="polite"></span>
      <button id="format-audit" type="button" aria-pressed="false">Vérifier le format</button>
      <button id="refresh-data" type="button">Actualiser</button>
    </div>

    <div class="search-box">
      <div class="search-actions">
        <label class="search-label" for="search">Recherche par date, ID, titre, thème ou contenu</label>
        <button id="favorites-toggle" type="button" aria-expanded="false">⭐ Favoris <span id="favorite-count">0</span></button>
      </div>
      <div class="search-input-wrap">
        <label class="sr-only" for="search">Rechercher les messages</label>
        <input id="search" type="search" placeholder="Date, ID, titre, mot ou thème…" autocomplete="off" disabled>
        <button id="clear-search" type="button" aria-label="Effacer la recherche" title="Effacer" hidden>×</button>
      </div>
      <div id="search-summary" role="status" aria-live="polite"></div>
      <section id="favorite-panel" hidden aria-label="Messages favoris">
        <div id="favorite-list"></div>
      </section>
    </div>

    <div class="list-summary">
      <span id="result-count">Chargement…</span>
      <span id="sort-label">ID décroissant</span>
    </div>
    <button id="return-favorites" type="button" hidden>← Retour aux favoris</button>
    <section id="message-list" aria-label="Messages"></section>
  </main>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="Retour en haut" title="Retour en haut" hidden>↑</button>

  <section class="player" aria-label="Lecteur audio">
    <div class="player-inner">
      <div class="player-heading">
        <strong>Lecteur</strong>
        <span id="player-status" role="status" aria-live="polite">Prêt</span>
      </div>
      <div class="player-controls">
        <button id="play-all" type="button" aria-pressed="false">▶▶ Tout lire</button>
        <button id="play-search" type="button" aria-pressed="false">🔍 Lire recherche</button>
        <button id="toggle-play" type="button">⏸ Pause</button>
        <button id="stop-play" type="button">⏹ Arrêter</button>
      </div>
      <audio id="audio-player" controls preload="auto" aria-label="Piste audio en cours"></audio>
      <div class="playback-progress">
        <label class="sr-only" for="playback-seek">Avancement de la lecture</label>
        <input id="playback-seek" type="range" min="0" max="1000" value="0" disabled>
        <span id="playback-time">0:00 / 0:00</span>
      </div>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const DATA_URL = 'https://emmanuel-dpv.pages.dev/data2.json';
      const elements = {
        status: document.getElementById('load-status'),
        search: document.getElementById('search'),
        searchSummary: document.getElementById('search-summary'),
        resultCount: document.getElementById('result-count'),
        list: document.getElementById('message-list'),
        favoritesToggle: document.getElementById('favorites-toggle'),
        favoriteCount: document.getElementById('favorite-count'),
        favoritePanel: document.getElementById('favorite-panel'),
        favoriteList: document.getElementById('favorite-list'),
        returnFavorites: document.getElementById('return-favorites'),
        auditButton: document.getElementById('format-audit'),
        auditCount: document.getElementById('audit-count'),
        playerStatus: document.getElementById('player-status'),
        audio: document.getElementById('audio-player'),
        playbackSeek: document.getElementById('playback-seek'),
        playbackTime: document.getElementById('playback-time'),
        backToTop: document.getElementById('back-to-top')
      };

      window.addEventListener('scroll', () => {
        elements.backToTop.hidden = window.scrollY <= 240;
      }, { passive: true });
      elements.backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      let messages = [];
      let sourceMessages = [];
      let searchIndex = [];
      let favoriteIds = new Set();
      let auditItems = [];
      let auditMode = false;
      let visibleMessages = [];
      let playlist = [];
      let trackIndex = -1;
      let activeModeButton = null;
      let stopAfterTrack = false;
      let searchTimer;
      let wakeLock;
      let nativePlayback = false;
      const prefetchAudio = new Audio(); // préchargement silencieux de la piste suivante
      prefetchAudio.preload = 'auto';

      function normalize(value) {
        return String(value ?? '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase('fr')
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          .trim();
      }

      const synonymGroups = [
        ['foi', 'confiance', 'faith', 'trust'],
        ['peur', 'crainte', 'angoisse', 'fear'],
        ['prière', 'oraison', 'prayer'],
        ['amour', 'charité', 'love'],
        ['espoir', 'espérance', 'hope'],
        ['joie', 'bonheur', 'joy'],
        ['paix', 'sérénité', 'peace'],
        ['épreuve', 'difficulté', 'trial'],
        ['guérison', 'restauration', 'healing'],
        ['gratitude', 'reconnaissance', 'thanksgiving'],
        ['doute', 'questionnement', 'doubt'],
        ['solitude', 'isolement', 'loneliness']
      ];
      const synonymIndex = new Map();
      for (const group of synonymGroups) {
        const terms = group.map(normalize);
        for (const term of terms) synonymIndex.set(term, terms.filter((candidate) => candidate !== term));
      }

      function searchableText(message) {
        return normalize([
          message.id,
          message.date,
          message.titre,
          message.titre_en,
          message.categorie,
          message.categorie_en,
          message.theme,
          message.theme_en,
          message.texte,
          message.texte_en
        ].join(' '));
      }

      function findMessages(query) {
        const normalizedQuery = normalize(query);
        if (!normalizedQuery) return messages;

        const terms = normalizedQuery.split(' ').filter(Boolean);
        return searchIndex
          .map((entry) => {
            const paddedText = ` ${entry.text} `;
            const paddedTitle = ` ${entry.title} `;
            const paddedCategory = ` ${entry.category} `;
            let exactMatches = 0;
            let prefixMatches = 0;
            let synonymMatches = 0;
            for (const term of terms) {
              if (entry.words.has(term)) {
                exactMatches += 1;
              } else if ([...entry.words].some((word) => word.startsWith(term))) {
                prefixMatches += 1;
              } else if ((synonymIndex.get(term) || []).some((synonym) => entry.words.has(synonym))) {
                synonymMatches += 1;
              } else {
                return { message: entry.message, score: 0 };
              }
            }
            let score = exactMatches * 100 + prefixMatches * 50 + synonymMatches * 10;
            if (paddedText.includes(` ${normalizedQuery} `)) score += 500;
            if (paddedTitle.includes(` ${normalizedQuery} `)) score += 180;
            if (paddedCategory.includes(` ${normalizedQuery} `)) score += 150;
            if (entry.date === normalizedQuery || entry.id === normalizedQuery) score += 1000;
            return { message: entry.message, score };
          })
          .filter((entry) => entry.score > 0)
          .sort((a, b) => b.score - a.score || Number(b.message.id) - Number(a.message.id))
          .map((entry) => entry.message);
      }

      function loadFavorites() {
        try {
          const saved = JSON.parse(localStorage.getItem('emmanuel_favorite_messages_v1') || '[]');
          if (!Array.isArray(saved)) throw new Error('Le format des favoris est invalide.');
          favoriteIds = new Set(saved.filter((id) => Number.isSafeInteger(id) && id > 0));
        } catch (error) {
          console.error('Impossible de charger les favoris enregistrés.', error);
          elements.searchSummary.textContent = 'Impossible de charger les favoris sur cet appareil.';
          favoriteIds = new Set();
        }
        updateFavoriteButtons();
      }

      elements.list.addEventListener('click', (event) => {
        const button = event.target.closest('.favorite-toggle[data-favorite-id]');
        if (button) toggleFavorite(button.dataset.favoriteId);
      });

      elements.favoritesToggle.addEventListener('click', () => {
        const opening = elements.favoritePanel.hidden;
        elements.favoritePanel.hidden = !opening;
        elements.favoritesToggle.setAttribute('aria-expanded', String(opening));
        elements.returnFavorites.hidden = true;
        if (opening) {
          elements.searchSummary.textContent = `${favoriteIds.size} message${favoriteIds.size === 1 ? '' : 's'} favori${favoriteIds.size === 1 ? '' : 's'}`;
          renderFavorites();
        } else {
          renderMessages(findMessages(elements.search.value));
        }
      });

      elements.favoriteList.addEventListener('click', (event) => {
        const button = event.target.closest('.favorite-item[data-id]');
        if (!button) return;
        const message = messages.find((item) => String(item.id) === button.dataset.id);
        if (!message) return;
        elements.favoritePanel.hidden = true;
        elements.favoritesToggle.setAttribute('aria-expanded', 'false');
        elements.returnFavorites.hidden = false;
        elements.search.value = '';
        document.getElementById('clear-search').hidden = true;
        renderMessages([message]);
        elements.searchSummary.textContent = `Favori ouvert : ${message.titre || 'Message sans titre'}`;
        document.getElementById(`message-${Number(message.id) || 0}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      elements.returnFavorites.addEventListener('click', () => {
        elements.returnFavorites.hidden = true;
        elements.favoritePanel.hidden = false;
        elements.favoritesToggle.setAttribute('aria-expanded', 'true');
        renderFavorites();
        renderMessages(findMessages(elements.search.value));
        elements.searchSummary.textContent = `${favoriteIds.size} message${favoriteIds.size === 1 ? '' : 's'} favori${favoriteIds.size === 1 ? '' : 's'}`;
      });

      function updateFavoriteButtons() {
        document.querySelectorAll('.favorite-toggle[data-favorite-id]').forEach((button) => {
          const isFavorite = favoriteIds.has(Number(button.dataset.favoriteId));
          const label = isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris';
          button.classList.toggle('is-favorite', isFavorite);
          button.setAttribute('aria-pressed', String(isFavorite));
          button.setAttribute('aria-label', label);
          button.title = label;
          button.textContent = isFavorite ? '❤️' : '🤍';
        });
        elements.favoriteCount.textContent = String(favoriteIds.size);
      }

      function toggleFavorite(id) {
        const messageId = Number(id);
        if (!Number.isSafeInteger(messageId) || messageId < 1) return;

        const wasFavorite = favoriteIds.has(messageId);
        if (wasFavorite) favoriteIds.delete(messageId);
        else favoriteIds.add(messageId);

        try {
          localStorage.setItem('emmanuel_favorite_messages_v1', JSON.stringify([...favoriteIds]));
        } catch (error) {
          if (wasFavorite) favoriteIds.add(messageId);
          else favoriteIds.delete(messageId);
          console.error('Impossible d’enregistrer les favoris.', error);
          elements.searchSummary.textContent = 'Impossible d’enregistrer les favoris sur cet appareil.';
        }
        updateFavoriteButtons();
        if (!elements.favoritePanel.hidden) renderFavorites();
      }

      function renderFavorites() {
        const favorites = messages
          .filter((message) => favoriteIds.has(Number(message.id)))
          .sort((a, b) => Number(b.id) - Number(a.id));
        elements.favoriteList.replaceChildren();
        if (!favorites.length) {
          const empty = document.createElement('p');
          empty.className = 'empty-state';
          empty.textContent = 'Aucun message favori pour le moment.';
          elements.favoriteList.append(empty);
          return;
        }
        for (const message of favorites) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'favorite-item';
          button.dataset.id = String(message.id);
          const title = document.createElement('strong');
          title.textContent = message.titre || 'Message sans titre';
          const details = document.createElement('span');
          details.textContent = `${message.date || 'Date inconnue'} · ID ${message.id}`;
          button.append(title, details);
          elements.favoriteList.append(button);
        }
      }

      function appendFormattedText(container, value) {
        const paragraphs = String(value ?? '').split(/\n+/);
        paragraphs.forEach((paragraph, index) => {
          if (index) container.append(document.createElement('br'), document.createElement('br'));
          const parts = paragraph.split(/(\*\*[^*]+\*\*)/g);
          parts.forEach((part) => {
            if (part.startsWith('**') && part.endsWith('**')) {
              const strong = document.createElement('strong');
              strong.textContent = part.slice(2, -2);
              container.append(strong);
            } else {
              container.append(document.createTextNode(part));
            }
          });
        });
      }

      function validMediaUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === 'https:' ? url.href : '';
        } catch {
          return '';
        }
      }

      function auditMessageFormat(source) {
        const idCounts = new Map();
        for (const message of source) {
          if (!message || typeof message !== 'object' || message.id == null || message.id === '') continue;
          const id = String(message.id);
          idCounts.set(id, (idCounts.get(id) || 0) + 1);
        }

        const textFields = ['titre', 'titre_en', 'categorie', 'categorie_en', 'texte', 'texte_en'];
        const mediaFields = ['audio'];
        const optionalMediaFields = ['audio2'];
        const labels = {
          id: 'ID', date: 'date', titre: 'titre', titre_en: 'titre anglais',
          categorie: 'catégorie', categorie_en: 'catégorie anglaise', texte: 'texte',
          texte_en: 'texte anglais', audio: 'audio', audio2: 'audio 2'
        };

        return source.map((message) => {
          const issues = [];
          if (!message || typeof message !== 'object' || Array.isArray(message)) {
            return { message: null, issues: ['Enregistrement non objet.'] };
          }

          if (!Number.isSafeInteger(message.id) || message.id < 1) issues.push('ID absent ou invalide.');
          else if (idCounts.get(String(message.id)) > 1) issues.push(`ID ${message.id} en doublon.`);

          const dateParts = typeof message.date === 'string' && /^(\d{4})-(\d{2})-(\d{2})$/.exec(message.date);
          if (!dateParts) {
            issues.push('Date absente ou au format invalide.');
          } else {
            const [, year, month, day] = dateParts;
            const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
            if (date.getUTCFullYear() !== Number(year) || date.getUTCMonth() !== Number(month) - 1 || date.getUTCDate() !== Number(day)) {
              issues.push('Date calendrier invalide.');
            }
          }

          for (const field of textFields) {
            if (typeof message[field] !== 'string' || !message[field].trim()) {
              issues.push(`${labels[field]} absent ou invalide.`);
            }
          }

          for (const field of mediaFields) {
            if (!validMediaUrl(message[field])) issues.push(`${labels[field]} absent ou URL HTTPS invalide.`);
          }
          for (const field of optionalMediaFields) {
            if (message[field] != null && message[field] !== '' && !validMediaUrl(message[field])) {
              issues.push(`${labels[field]} URL HTTPS invalide.`);
            }
          }

          return { message, issues };
        }).filter((entry) => entry.issues.length > 0);
      }

      function renderAuditMessages() {
        visibleMessages = auditItems.map((entry) => entry.message).filter(Boolean);
        const fragment = document.createDocumentFragment();
        for (const entry of auditItems) {
          const card = createMessageCard(entry.message || {});
          const issues = document.createElement('p');
          issues.className = 'audit-issues';
          issues.textContent = `À corriger : ${entry.issues.join(' · ')}`;
          card.append(issues);
          fragment.append(card);
        }
        if (!auditItems.length) {
          const empty = document.createElement('p');
          empty.className = 'empty-state';
          empty.textContent = 'Tous les messages respectent le format attendu.';
          fragment.append(empty);
        }
        elements.list.replaceChildren(fragment);
        elements.resultCount.textContent = `${auditItems.length} message${auditItems.length > 1 ? 's' : ''} à vérifier`;
      }

      function createMessageCard(message) {
        const article = document.createElement('article');
        article.className = 'message';
        article.id = `message-${Number(message.id) || 0}`;
        article.dataset.id = String(message.id ?? '');

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        const id = document.createElement('span');
        id.className = 'message-id';
        id.textContent = `ID ${message.id ?? '—'}`;
        const date = document.createElement('time');
        date.textContent = message.date || 'Date non renseignée';
        date.dateTime = /^\d{4}-\d{2}-\d{2}$/.test(message.date || '') ? message.date : '';
        meta.append(id, date);
        if (Number.isSafeInteger(Number(message.id)) && Number(message.id) > 0) {
          const favorite = document.createElement('button');
          favorite.className = 'favorite-toggle';
          favorite.type = 'button';
          favorite.dataset.favoriteId = String(message.id);
          const isFavorite = favoriteIds.has(Number(message.id));
          const label = isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris';
          favorite.textContent = isFavorite ? '❤️' : '🤍';
          favorite.setAttribute('aria-pressed', String(isFavorite));
          favorite.setAttribute('aria-label', label);
          favorite.title = label;
          meta.append(favorite);
        }

        const title = document.createElement('h2');
        title.textContent = message.titre || 'Message sans titre';

        article.append(meta, title);
        if (message.categorie || message.theme) {
          const category = document.createElement('p');
          category.className = 'category';
          category.textContent = message.categorie || message.theme;
          article.append(category);
        }

        const imageUrl = validMediaUrl(message.image);
        if (imageUrl) {
          const image = document.createElement('img');
          image.className = 'message-image';
          image.src = imageUrl;
          image.alt = '';
          image.loading = 'lazy';
          image.decoding = 'async';
          article.append(image);
        }

        const text = document.createElement('div');
        text.className = 'message-text';
        appendFormattedText(text, message.texte);
        article.append(text);

        if (trackListFor([message]).length) {
          const play = document.createElement('button');
          play.className = 'message-play';
          play.type = 'button';
          play.setAttribute('aria-pressed', 'false');
          play.textContent = '▶ Lire ce message';
          play.addEventListener('click', () => {
            const card = document.getElementById(`message-${Number(message.id) || 0}`);
            const isCurrentlyPlaying = card && card.classList.contains('is-playing');
            if (isCurrentlyPlaying) {
              // 2ème clic pendant la lecture → colore en jaune + active lecture continue
              const messageIndex = visibleMessages.findIndex((item) => String(item.id) === String(message.id));
              const sourceQueue = messageIndex < 0 ? [message] : visibleMessages.slice(0, messageIndex + 1).reverse();
              const newTracks = trackListFor(sourceQueue);
              if (newTracks.length) {
                const currentTrack = playlist[trackIndex];
                const newIndex = currentTrack
                  ? newTracks.findIndex((t) => t.id === currentTrack.id && t.part === currentTrack.part)
                  : 0;
                playlist = newTracks;
                trackIndex = newIndex >= 0 ? newIndex : 0;
                stopAfterTrack = false;
                setActiveModeButton(play);
              }
            } else {
              // 1er clic → lit ce message seul
              startQueue([message], `Message ${message.id}`, null);
            }
          });
          article.append(play);
        }
        return article;
      }

      function renderMessages(list) {
        auditMode = false;
        elements.auditButton.setAttribute('aria-pressed', 'false');
        visibleMessages = list;
        const fragment = document.createDocumentFragment();
        for (const message of list) fragment.append(createMessageCard(message));
        elements.list.replaceChildren(fragment);
        elements.resultCount.textContent = elements.search.value.trim()
          ? `${list.length} résultat${list.length > 1 ? 's' : ''} sur ${messages.length}`
          : `${list.length} message${list.length > 1 ? 's' : ''}`;
      }

      function trackListFor(list) {
        const tracks = [];
        for (const message of list) {
          for (const field of ['audio', 'audio2']) {
            const url = validMediaUrl(message[field]);
            if (url) {
              tracks.push({
                id: String(message.id ?? ''),
                title: message.titre || 'Message sans titre',
                date: message.date || '',
                source: url,
                part: field === 'audio2' ? 2 : 1
              });
            }
          }
        }
        return tracks;
      }

      function sendToNative(action, tracks) {
        if (!window.NativePlayer) return false;
        try {
          const command = { action };
          if (action === 'play') command.tracks = tracks ?? [];
          if (action === 'seek') command.positionMs = tracks;
          window.NativePlayer.postMessage(JSON.stringify(command));
          return true;
        } catch {
          return false;
        }
      }

      function updateMediaSession(track) {
        if (!('mediaSession' in navigator)) return;
        if (!track) {
          navigator.mediaSession.metadata = null;
          navigator.mediaSession.playbackState = 'none';
          return;
        }
        if ('MediaMetadata' in window) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: `Message ${track.id}${track.part === 2 ? ' · piste 2' : ''}`,
            album: 'EMMANUEL'
          });
        }
        navigator.mediaSession.playbackState = elements.audio.paused ? 'paused' : 'playing';
      }

      function setPlayerMode(mode) {
        const playerEl = document.querySelector('.player');
        if (playerEl) playerEl.classList.toggle('is-playing', mode === 'playing');
      }

      function setPlayerStatus(track) {
        if (!track) {
          elements.playerStatus.textContent = 'Prêt';
          document.querySelectorAll('.message.is-playing').forEach((card) => card.classList.remove('is-playing'));
          setActiveModeButton(null);
          updateMediaSession(null);
          setPlayerMode('idle');
          return;
        }
        elements.playerStatus.textContent = `${track.title} · ID ${track.id}${track.part === 2 ? ' · piste 2' : ''}`;
        document.querySelectorAll('.message.is-playing').forEach((card) => card.classList.remove('is-playing'));
        const activeCard = document.getElementById(`message-${track.id}`);
        activeCard?.classList.add('is-playing');
        activeCard?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        updateMediaSession(track);
        setPlayerMode('playing');
      }

      function setActiveModeButton(button) {
        if (activeModeButton) {
          activeModeButton.classList.remove('is-active');
          activeModeButton.setAttribute('aria-pressed', 'false');
        }
        activeModeButton = button;
        if (activeModeButton) {
          activeModeButton.classList.add('is-active');
          activeModeButton.setAttribute('aria-pressed', 'true');
        }
      }

      window.onNativePlayback = (state) => {
        nativePlayback = true;
        updatePlaybackProgress(Number(state.positionMs) || 0, Number(state.durationMs) || 0);
        if (state.track) {
          trackIndex = playlist.findIndex((track) =>
            track.id === String(state.track.id) && track.part === Number(state.track.part));
          setPlayerStatus(state.track);
          elements.playerStatus.textContent = `${state.track.title} · ID ${state.track.id}${state.track.part === 2 ? ' · piste 2' : ''}${state.playing ? '' : ' · en pause'}`;
        } else if (state.status) {
          elements.playerStatus.textContent = state.status;
        }
        if (state.ended) {
          playlist = [];
          trackIndex = -1;
          setActiveModeButton(null);
          updatePlaybackProgress(0, 0);
          setPlayerMode('idle');
        }
      };

      function formatTime(milliseconds) {
        const totalSeconds = Math.floor(Math.max(0, milliseconds) / 1000);
        return `${Math.floor(totalSeconds / 60)}:${String(totalSeconds % 60).padStart(2, '0')}`;
      }

      function updatePlaybackProgress(positionMs, durationMs) {
        const duration = Number.isFinite(durationMs) && durationMs > 0 ? durationMs : 0;
        const position = Number.isFinite(positionMs) && positionMs > 0 ? positionMs : 0;
        elements.playbackSeek.disabled = duration === 0;
        elements.playbackSeek.value = duration
          ? String(Math.min(1000, Math.round((position / duration) * 1000)))
          : '0';
        elements.playbackTime.textContent = `${formatTime(position)} / ${formatTime(duration)}`;
        elements.playbackTime.dataset.durationMs = String(duration);
      }

      for (const eventName of ['timeupdate', 'loadedmetadata', 'durationchange', 'seeking', 'seeked']) {
        elements.audio.addEventListener(eventName, () => {
          if (!nativePlayback) {
            updatePlaybackProgress(elements.audio.currentTime * 1000, elements.audio.duration * 1000);
          }
        });
      }

      elements.playbackSeek.addEventListener('change', () => {
        if (elements.playbackSeek.disabled) return;
        if (nativePlayback) {
          const positionMs = Math.round(Number(elements.playbackSeek.value) / 1000 * (Number(elements.playbackTime.dataset.durationMs) || 0));
          if (!sendToNative('seek', positionMs)) {
            elements.playerStatus.textContent = 'Impossible de déplacer la lecture audio.';
          }
          return;
        }
        if (Number.isFinite(elements.audio.duration) && elements.audio.duration > 0) {
          elements.audio.currentTime = Number(elements.playbackSeek.value) / 1000 * elements.audio.duration;
          updatePlaybackProgress(elements.audio.currentTime * 1000, elements.audio.duration * 1000);
        }
      });

      async function requestWakeLock() {
        if (!('wakeLock' in navigator) || wakeLock) return;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch {
          wakeLock = null;
        }
      }

      async function startQueue(sourceMessages, label, modeButton) {
        const tracks = trackListFor(sourceMessages);
        if (!tracks.length) {
          elements.playerStatus.textContent = 'Aucun message avec une piste audio dans cette sélection.';
          return;
        }
        playlist = tracks;
        trackIndex = 0;
        stopAfterTrack = false;
        setActiveModeButton(modeButton);
        if (sendToNative('play', tracks)) {
          nativePlayback = true;
          elements.playerStatus.textContent = `${label} · ${sourceMessages.length} messages`;
          return;
        }
        nativePlayback = false;
        await playTrack(0);
      }

      async function playTrack(index) {
        if (index < 0 || index >= playlist.length) {
          stopPlayback('Lecture terminée.');
          return;
        }
        trackIndex = index;
        const track = playlist[index];
        updatePlaybackProgress(0, 0);
        setPlayerStatus(track);
        await requestWakeLock();

        // Attendre que l'audio soit suffisamment chargé avant de lancer (max 8s)
        await new Promise((resolve) => {
          const audio = elements.audio;
          audio.src = track.source;
          audio.preload = 'auto';
          audio.load();

          // Déjà assez chargé → on y va
          if (audio.readyState >= 3) { resolve(); return; }

          let resolved = false;
          const done = () => { if (!resolved) { resolved = true; resolve(); } };

          const onReady = () => { audio.removeEventListener('canplaythrough', onReady); audio.removeEventListener('error', onError); done(); };
          const onError = () => { audio.removeEventListener('canplaythrough', onReady); audio.removeEventListener('error', onError); done(); };

          audio.addEventListener('canplaythrough', onReady, { once: true });
          audio.addEventListener('error', onError, { once: true });

          // Timeout 8 secondes → on tente quand même
          setTimeout(done, 8000);
        });

        try {
          await elements.audio.play();
          // Précharge silencieusement la piste suivante
          const next = playlist[index + 1];
          if (next && next.source !== prefetchAudio.src) {
            prefetchAudio.src = next.source;
            prefetchAudio.preload = 'auto';
            prefetchAudio.load();
          }
        } catch {
          elements.playerStatus.textContent = 'Audio indisponible · passage au suivant…';
          playTrack(index + 1);
        }
      }

      function stopPlayback(message = 'Lecture arrêtée.') {
        sendToNative('stop');
        nativePlayback = false;
        stopAfterTrack = true;
        playlist = [];
        trackIndex = -1;
        elements.audio.pause();
        elements.audio.removeAttribute('src');
        elements.audio.load();
        // libère le préchargement
        prefetchAudio.removeAttribute('src');
        prefetchAudio.load();
        updatePlaybackProgress(0, 0);
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
        setPlayerStatus(null);
        elements.playerStatus.textContent = message;
      }

      elements.audio.addEventListener('ended', () => {
        if (stopAfterTrack || nativePlayback) return;
        playTrack(trackIndex + 1);
      });

      elements.audio.addEventListener('play', () => {
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      });

      elements.audio.addEventListener('pause', () => {
        if ('mediaSession' in navigator && trackIndex >= 0) navigator.mediaSession.playbackState = 'paused';
      });

      elements.search.addEventListener('input', () => {
        document.getElementById('clear-search').hidden = !elements.search.value;
        elements.favoritePanel.hidden = true;
        elements.favoritesToggle.setAttribute('aria-expanded', 'false');
        elements.returnFavorites.hidden = true;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => renderMessages(findMessages(elements.search.value)), 50);
      });

      document.getElementById('clear-search').addEventListener('click', () => {
        elements.search.value = '';
        document.getElementById('clear-search').hidden = true;
        renderMessages(findMessages(''));
        elements.search.focus();
      });

      document.getElementById('play-all').addEventListener('click', (event) =>
        startQueue(messages, 'Tous les messages', event.currentTarget));
      document.getElementById('play-search').addEventListener('click', () => {
        const query = elements.search.value.trim();
        if (!query) {
          elements.playerStatus.textContent = 'Saisis un thème ou une recherche avant de lancer la lecture thématique.';
          elements.search.focus();
          return;
        }
        startQueue(findMessages(query), 'Lecture thématique', document.getElementById('play-search'));
      });
      document.getElementById('toggle-play').addEventListener('click', async () => {
        if (nativePlayback) {
          sendToNative('toggle');
          return;
        }
        if (elements.audio.paused && trackIndex >= 0) {
          try {
            await elements.audio.play();
          } catch {
            elements.playerStatus.textContent = 'La lecture n’a pas pu reprendre.';
          }
        } else if (!elements.audio.paused) {
          elements.audio.pause();
        } else {
          elements.playerStatus.textContent = 'Lance une liste ou choisis un message.';
        }
      });
      document.getElementById('stop-play').addEventListener('click', () => stopPlayback());

      if ('mediaSession' in navigator) {
        for (const [action, handler] of [
          ['play', () => document.getElementById('toggle-play').click()],
          ['pause', () => {
            if (nativePlayback) sendToNative('pause');
            else elements.audio.pause();
          }],
          ['stop', () => stopPlayback()],
          ['nexttrack', () => {
            if (nativePlayback) sendToNative('next');
            else playTrack(trackIndex + 1);
          }],
          ['previoustrack', () => {
            if (nativePlayback) sendToNative('previous');
            else playTrack(Math.max(0, trackIndex - 1));
          }]
        ]) {
          try { navigator.mediaSession.setActionHandler(action, handler); } catch {}
        }
      }

      function displayMessages(data) {
        if (!data || !Array.isArray(data.messages)) {
          throw new Error('la structure attendue est { "messages": [...] }');
        }
        sourceMessages = data.messages;
        auditItems = auditMessageFormat(sourceMessages);
        auditMode = false;
        elements.auditButton.setAttribute('aria-pressed', 'false');
        elements.auditCount.textContent = auditItems.length
          ? `${auditItems.length} anomalie${auditItems.length > 1 ? 's' : ''}`
          : 'Format conforme';
        messages = data.messages
          .filter((message) => message && typeof message === 'object')
          .slice()
          .sort((a, b) => Number(b.id || 0) - Number(a.id || 0));
        searchIndex = messages.map((message) => {
          const text = searchableText(message);
          const words = new Set(text.split(' ').filter(Boolean));
          return {
            message,
            id: normalize(message.id),
            date: normalize(message.date),
            title: normalize(`${message.titre || ''} ${message.titre_en || ''}`),
            category: normalize(`${message.categorie || ''} ${message.theme || ''} ${message.categorie_en || ''} ${message.theme_en || ''}`),
            text,
            words,
            wordList: [...words]
          };
        });
        elements.search.disabled = false;
        loadFavorites();
        document.getElementById('clear-search').hidden = !elements.search.value;
        elements.status.textContent = `Source : data2.json · ${messages.length} messages`;
        renderMessages(findMessages(elements.search.value));
      }

      window.receiveMessages = (json, error) => {
        document.getElementById('refresh-data').disabled = false;
        if (error) {
          elements.status.textContent = `Chargement du data2.json en ligne impossible : ${error}. Vérifie ta connexion puis actualise.`;
          elements.resultCount.textContent = 'Aucun message chargé';
          elements.list.replaceChildren();
          return;
        }
        try {
          displayMessages(typeof json === 'string' ? JSON.parse(json) : json);
        } catch (exception) {
          elements.status.textContent = `data2.json invalide : ${exception.message}`;
          elements.resultCount.textContent = 'Aucun message chargé';
          elements.list.replaceChildren();
        }
      };

      async function loadMessages() {
        const refreshButton = document.getElementById('refresh-data');
        refreshButton.disabled = true;
        elements.status.textContent = 'Lecture du data2.json en ligne…';
        if (window.NativeDataReader) {
          window.NativeDataReader.postMessage('load');
          return;
        }
        try {
          const response = await fetch(DATA_URL, {
            cache: 'no-store',
            mode: 'cors',
            credentials: 'omit'
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          displayMessages(await response.json());
        } catch (error) {
          elements.status.textContent = `Chargement du data2.json en ligne impossible : ${error.message}. Vérifie ta connexion puis actualise.`;
          elements.resultCount.textContent = 'Aucun message chargé';
          elements.list.replaceChildren();
        } finally {
          refreshButton.disabled = false;
        }
      }

      document.getElementById('refresh-data').addEventListener('click', loadMessages);
      elements.auditButton.addEventListener('click', () => {
        auditMode = !auditMode;
        elements.auditButton.setAttribute('aria-pressed', String(auditMode));
        if (auditMode) renderAuditMessages();
        else renderMessages(findMessages(elements.search.value));
      });

      window.addEventListener('pagehide', () => {
        if (!nativePlayback && wakeLock) wakeLock.release().catch(() => {});
      });

      loadMessages();
    })();
  </script>
</body>
